@if (presenter.throwing()) {
  <fr-screen-overlay [burst]="presenter.burst()" />
}
<fr-toast [open]="view() !== undefined" [emphasis]="emphasis()">
  @if (view(); as shown) {
    <fr-stack align="center" gap="2xs">
      <fr-text [tone]="Muted">{{ shown.roll.label }}</fr-text>
      @for (line of shown.lines; track $index) {
        <fr-stack direction="horizontal" align="baseline" gap="xs">
          <fr-text [variant]="Heading" [weight]="Bold" [damage]="line.tone" [numeric]="true">{{ line.total }}</fr-text>
          @for (note of line.notes; track note.key) {
            <fr-text [tone]="Muted">{{ note.key | transloco: note.params }}</fr-text>
          }
        </fr-stack>
      }
      @for (key of shown.headlines; track key) {
        <fr-text [weight]="Bold">{{ key | transloco }}</fr-text>
      }
      <pio-roll-outcome [outcome]="shown.roll.outcome" />
    </fr-stack>
  }
</fr-toast>
