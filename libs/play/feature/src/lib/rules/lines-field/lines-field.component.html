<fr-field [invalid]="bad().length > 0">
  <fr-label>{{ label() }}</fr-label>
  <fr-text-area monospace [rows]="rows()" [(value)]="value" />
  @if (bad().length > 0) {
    <fr-field-error>{{ errorKey() | transloco: { count: bad().length, lines: lineList() } }}</fr-field-error>
  } @else {
    <fr-field-hint>{{ hint() }}</fr-field-hint>
  }
</fr-field>
