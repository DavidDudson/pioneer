@let tool = result();
@if (tool.kind === ToolKind.Formula) {
  <pio-formula-result [check]="tool.check" />
} @else if (tool.kind === ToolKind.Verdict) {
  <pio-predicate-verdict-result [check]="tool.check" />
} @else if (tool.kind === ToolKind.Statistics) {
  <pio-statistics-result [check]="tool.check" />
} @else if (tool.kind === ToolKind.Grants) {
  <pio-grants-result [check]="tool.check" />
} @else if (tool.kind === ToolKind.RichText) {
  <pio-rich-text-result [outcome]="tool.check" [preview]="tool.preview" />
} @else {
  <pio-rules-result [outcome]="tool.check" />
}
