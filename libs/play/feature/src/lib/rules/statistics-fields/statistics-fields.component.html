@let shown = problems();
<fr-stack gap="md">
  <pio-json-field
    [label]="'play.rules.statisticsLabel' | transloco"
    [hint]="'play.rules.statisticsHint' | transloco"
    [problem]="shown.definitions"
    [rows]="definitionRows"
    [(value)]="definitions"
  />
  <pio-json-field
    [label]="'play.rules.inputsLabel' | transloco"
    [hint]="'play.rules.inputsHint' | transloco"
    [problem]="shown.inputs"
    [rows]="inputRows"
    [(value)]="inputs"
  />
  <pio-json-field
    [label]="'play.rules.ruleElementsLabel' | transloco"
    [hint]="'play.rules.ruleElementsHint' | transloco"
    [problem]="shown.rules"
    [rows]="definitionRows"
    [(value)]="rules"
  />
  <pio-json-field
    [label]="'play.rules.overridesLabel' | transloco"
    [hint]="'play.rules.overridesHint' | transloco"
    [problem]="shown.overrides"
    [rows]="inputRows"
    [(value)]="overrides"
  />
  <fr-field [invalid]="badLines().length > 0">
    <fr-label>{{ 'play.rules.factsLabel' | transloco }}</fr-label>
    <fr-text-area monospace [rows]="factRows" [(value)]="facts" />
    @if (badLines().length > 0) {
      <fr-field-error>{{
        'play.rules.badFacts' | transloco: { count: badLines().length, lines: badLineList() }
      }}</fr-field-error>
    } @else {
      <fr-field-hint>{{ 'play.rules.factsHint' | transloco }}</fr-field-hint>
    }
  </fr-field>
</fr-stack>
