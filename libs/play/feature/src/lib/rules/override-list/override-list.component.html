<fr-list gap="xs" markers>
  @for (line of shown(); track line.key) {
    <fr-list-item>
      <fr-stack gap="3xs">
        <fr-stack direction="horizontal" gap="xs" align="center" wrap>
          <fr-badge [tone]="OVERRIDE_STATE_TONES[line.state]">{{
            OVERRIDE_STATE_KEYS[line.state] | transloco
          }}</fr-badge>
          @if (line.manual) {
            <fr-badge tone="warning">{{ 'play.rules.manual' | transloco }}</fr-badge>
          }
          <fr-text>{{ line.name }}</fr-text>
          <fr-text tone="muted">{{ line.effect }}</fr-text>
        </fr-stack>
        @if (line.detail; as detail) {
          <fr-text variant="caption" tone="muted">{{ detail }}</fr-text>
        }
      </fr-stack>
    </fr-list-item>
  }
</fr-list>
