@if (card(); as shown) {
  <fr-stack>
    <pio-entry-preview [full]="full()" [preview]="shown" [headingLevel]="headingLevel()" />
    @for (store of stores(); track store.url) {
      <fr-link [external]="store.url">{{ Message.Store | transloco: { title: (store.title | transloco) } }}</fr-link>
    }
  </fr-stack>
} @else {
  <fr-empty-state
    ><fr-empty-state-media [icon]="missingIcon" /><fr-empty-state-header
      ><fr-empty-state-title>{{ Message.MissingTitle | transloco }}</fr-empty-state-title
      ><fr-empty-state-description>{{
        Message.MissingDescription | transloco
      }}</fr-empty-state-description></fr-empty-state-header
    ></fr-empty-state
  >
}
