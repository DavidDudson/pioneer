@if (card(); as shown) {
  <fr-stack gap="md">
    <pio-entry-preview [full]="full()" [preview]="shown" [headingLevel]="headingLevel()" />
    @for (store of stores(); track store.url) {
      <fr-link [external]="store.url">{{ Message.Store | transloco: { title: (store.title | transloco) } }}</fr-link>
    }
  </fr-stack>
} @else {
  <fr-empty-state
    [icon]="missingIcon"
    [title]="Message.MissingTitle | transloco"
    [description]="Message.MissingDescription | transloco"
  />
}
