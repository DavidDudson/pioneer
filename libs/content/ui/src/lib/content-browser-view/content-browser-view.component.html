<fr-stack gap="none">
  @if (regions().search) {
    <pio-browser-toolbar
      [kindOptions]="kindOptions()"
      [fields]="fields()"
      [facetState]="facetState()"
      [facets]="regions().facets"
      [list]="listShown()"
      [(state)]="state"
      (facetChange)="facetChange.emit($event)"
    />
  }
  @if (showEntry()) {
    <fr-stack gap="md">
      @if (regions().list) {
        <fr-stack direction="horizontal">
          <fr-button (pressed)="back()">{{ Message.Back | transloco }}</fr-button>
        </fr-stack>
      }
      <fr-async-region [errorMessage]="Message.EntryError | transloco">
        <ng-template frAsyncPending>
          <fr-stack gap="xs">
            @for (row of loadingRows; track row) {
              <fr-skeleton width="lg" />
            }
          </fr-stack>
        </ng-template>
        <ng-template let-shown [frAsyncData]="entry()">
          <pio-content-entry-view
            [card]="shown.card"
            [stores]="shown.stores"
            [full]="full()"
            [headingLevel]="headingLevel()"
          />
        </ng-template>
      </fr-async-region>
    </fr-stack>
  } @else if (regions().list) {
    <fr-async-region [errorMessage]="listError() | transloco">
      <ng-template frAsyncPending>
        <fr-stack gap="xs">
          @for (row of loadingRows; track row) {
            <fr-skeleton width="lg" />
          }
        </fr-stack>
      </ng-template>
      <ng-template let-shown [frAsyncData]="list()">
        <pio-browser-rows
          [list]="shown"
          [columns]="columns()"
          [table]="regions().table"
          [(sorting)]="sorting"
          [(hidden)]="hidden"
          [(density)]="density"
          (more)="more.emit()"
          (picked)="pick($event)"
        />
      </ng-template>
    </fr-async-region>
  }
</fr-stack>
