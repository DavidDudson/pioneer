<fr-stack gap="md">
  @if (regions().search) {
    <pio-browser-search [kindOptions]="kindOptions()" [(state)]="state" />
  }
  @if (showEntry()) {
    @if (regions().list) {
      <fr-stack direction="horizontal">
        <fr-button (pressed)="back()">{{ Message.Back | transloco }}</fr-button>
      </fr-stack>
    }
    <fr-async-region [errorMessage]="Message.EntryError | transloco">
      <ng-template frAsyncPending>
        <fr-stack gap="xs">
          @for (row of loadingRows; track row) {
            <fr-skeleton width="lg" />
          }
        </fr-stack>
      </ng-template>
      <ng-template let-shown [frAsyncData]="entry()">
        <pio-content-entry-view [card]="shown.card" [full]="full()" [headingLevel]="headingLevel()" />
      </ng-template>
    </fr-async-region>
  } @else if (regions().list) {
    <fr-async-region [errorMessage]="listError() | transloco">
      <ng-template frAsyncPending>
        <fr-stack gap="xs">
          @for (row of loadingRows; track row) {
            <fr-skeleton width="lg" />
          }
        </fr-stack>
      </ng-template>
      <ng-template let-shown [frAsyncData]="list()">
        <fr-stack gap="md">
          <pio-browser-filters
            [fields]="fields()"
            [counts]="shown.counts"
            [facetState]="facetState()"
            [facets]="regions().facets"
            [(state)]="state"
            (facetChange)="facetChange.emit($event)"
          />
          <pio-browser-rows
            [list]="shown"
            [columns]="columns()"
            [table]="regions().table"
            [(sorting)]="sorting"
            [(hidden)]="hidden"
            (more)="more.emit()"
            (picked)="pick($event)"
          />
        </fr-stack>
      </ng-template>
    </fr-async-region>
  }
</fr-stack>
