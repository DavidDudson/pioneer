  [state]="shownState()"
  [kindOptions]="kindOptions()"
  [fields]="fields()"
  [facetState]="facetState()"
  [list]="browse"
  [entry]="entry"
  [columns]="columns()"
  [sorting]="sorting()"
  [hidden]="hidden()"
