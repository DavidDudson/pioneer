<fr-page>
  <fr-page-header [title]="Message.Title | transloco" [description]="Message.Description | transloco" />
  <fr-page-body>
    <fr-stack gap="md">
      <fr-search-input
        [ariaLabel]="Message.SearchLabel | transloco"
        [placeholder]="Message.SearchLabel | transloco"
        [value]="words() ?? ''"
        (searched)="searched($event)"
      />
      <fr-filter-chips
        [ariaLabel]="Message.Kinds | transloco"
        [options]="kindOptions()"
        [value]="kindSet()"
        (valueChange)="pickKinds($event)"
      />
      <fr-async-region [errorMessage]="(searching() ? Message.SearchError : Message.LoadError) | transloco">
        <ng-template frAsyncPending>
          <fr-stack gap="xs">
            @for (row of loadingRows; track row) {
              <fr-skeleton width="lg" />
            }
          </fr-stack>
        </ng-template>
        <ng-template let-shown [frAsyncData]="browse">
          <fr-stack gap="md">
            <fr-filter-bar [fields]="fields()" [value]="view.filters()" (valueChange)="filtered($event)" />
            <pio-facet-filter [counts]="shown.counts" [state]="state()" (stateChange)="filter($event)" />
            <fr-text element="p" variant="caption" tone="muted">{{
              Message.Count | transloco: { count: total() }
            }}</fr-text>
            @if (total() === 0) {
              <fr-empty-state
                [icon]="emptyIcon"
                [title]="Message.EmptyTitle | transloco"
                [description]="(searching() ? Message.SearchEmptyDescription : Message.EmptyDescription) | transloco"
              />
            } @else {
              <fr-table
                hideCaption
                [data]="rows()"
                [columns]="columns()"
                [rowId]="rowId"
                [sorting]="view.sorting()"
                [columnVisibility]="view.hidden()"
                [caption]="Message.Caption | transloco"
                (sortingChange)="view.setSorting($event)"
                (columnVisibilityChange)="view.setHidden($event)"
              />
              @if (hasMore()) {
                <fr-stack direction="horizontal">
                  <fr-button (pressed)="more()">{{ Message.More | transloco }}</fr-button>
                </fr-stack>
              }
            }
          </fr-stack>
        </ng-template>
      </fr-async-region>
    </fr-stack>
  </fr-page-body>
</fr-page>
