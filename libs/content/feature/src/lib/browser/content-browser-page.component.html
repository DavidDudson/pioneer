<fr-page>
  <fr-page-header [title]="Message.Title | transloco" [description]="Message.Description | transloco" />
  <fr-page-body>
    <pio-content-browser
      [tier]="tier"
      [state]="state()"
      [sorting]="view.sorting()"
      [hidden]="view.hidden()"
      (stateChange)="write($event)"
      (sortingChange)="view.setSorting($event)"
      (hiddenChange)="view.setHidden($event)"
    />
  </fr-page-body>
</fr-page>
