<fr-page>
  <fr-page-header [title]="Message.Title | transloco" />
  <fr-page-body>
    <fr-stack gap="md">
      <fr-stack direction="horizontal">
        @if (origin) {
          <fr-button (pressed)="backToOrigin()">{{ Message.BackToOrigin | transloco }}</fr-button>
        }
        <fr-link [to]="browse" [queryParams]="browseParams()">{{ Message.Back | transloco }}</fr-link>
      </fr-stack>
      <fr-async-region [errorMessage]="Message.LoadError | transloco">
        <ng-template frAsyncPending>
          <fr-stack gap="xs">
            @for (row of loadingRows; track row) {
              <fr-skeleton width="lg" />
            }
          </fr-stack>
        </ng-template>
        <ng-template [frAsyncData]="registry">
          <pio-content-entry-view full [card]="card()" [headingLevel]="headingLevel" />
        </ng-template>
      </fr-async-region>
    </fr-stack>
  </fr-page-body>
</fr-page>
