<fr-page>
  <fr-page-header [title]="'identity.settings.title' | transloco" />
  <fr-page-body>
    <fr-surface>
      <fr-stack gap="md">
        <fr-picker-field
          [label]="'identity.settings.uiLocale' | transloco"
          [hint]="'identity.settings.uiLocaleHint' | transloco"
          [error]="uiError()"
          [rows]="uiLocales()"
          [columns]="localeColumns()"
          [rowValue]="localeValue"
          [rowLabel]="localeLabel"
          [value]="shown.ui()"
          (valueChange)="chooseUi($event)"
          (searched)="uiQuery.set($event)"
          (sorted)="uiSort.set($event)"
        />
        <fr-picker-field
          [label]="'identity.settings.contentLocale' | transloco"
          [hint]="'identity.settings.contentLocaleHint' | transloco"
          [error]="contentError()"
          [rows]="contentLocales()"
          [columns]="localeColumns()"
          [rowValue]="localeValue"
          [rowLabel]="localeLabel"
          [value]="shown.content()"
          (valueChange)="chooseContent($event)"
          (searched)="contentQuery.set($event)"
          (sorted)="contentSort.set($event)"
        />
        <fr-segmented-field
          [label]="'identity.settings.distanceUnit' | transloco"
          [hint]="'identity.settings.distanceUnitHint' | transloco"
          [error]="distanceUnitError()"
          [options]="distanceUnits()"
          [value]="shown.distanceUnit()"
          (valueChange)="chooseDistanceUnit($event)"
        />
      </fr-stack>
    </fr-surface>
  </fr-page-body>
</fr-page>
