<fr-box padding="sm" inline>
  <fr-stack direction="horizontal" align="center" justify="between" gap="xs">
    @if (current(); as user) {
      <fr-avatar size="sm" decorative [name]="user.displayName" />
    }
    <fr-dropdown
      align="end"
      [label]="'identityDev.switch.heading' | transloco"
      [caption]="current()?.displayName ?? ('identityDev.switch.heading' | transloco)"
    >
      <fr-stack gap="2xs">
        @for (user of users; track user.id) {
          <fr-button variant="menu" size="sm" [toggled]="current()?.id === user.id" (pressed)="switchTo(user)">{{
            user.displayName
          }}</fr-button>
        }
      </fr-stack>
    </fr-dropdown>
  </fr-stack>
</fr-box>
