@if (header().column.getCanSort()) {
  <fr-button variant="inline" (pressed)="header().column.toggleSorting()">
    <ng-container *flexRenderHeader="header(); let value">{{ value }}</ng-container>
    @if (sortIcon(); as icon) {
      <fr-icon [icon]="icon" />
    }
  </fr-button>
} @else {
  <ng-container *flexRenderHeader="header(); let value">{{ value }}</ng-container>
}
