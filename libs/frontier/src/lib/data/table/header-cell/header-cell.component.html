<ng-template #content>
  @if (label() !== undefined) {
    {{ label() }}
  } @else {
    <ng-container *flexRenderHeader="header(); let value">{{ value }}</ng-container>
  }
</ng-template>
@if (header().column.getCanSort()) {
  <fr-button variant="inline" (pressed)="sort($event)">
    <ng-container *ngTemplateOutlet="content" />
    @if (sortIcon(); as icon) {
      <fr-icon [icon]="icon" />
      <span aria-hidden="true" [class]="rankClasses">{{ rank() }}</span>
      <span [class]="hiddenClasses">{{ rankLabel() }}</span>
    }
  </fr-button>
} @else {
  <ng-container *ngTemplateOutlet="content" />
}
