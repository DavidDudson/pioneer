<input
  #control
  type="number"
  inputmode="numeric"
  step="1"
  [class]="classes"
  [attr.id]="id() ?? null"
  [value]="value()"
  [attr.min]="min() ?? null"
  [attr.max]="max() ?? null"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-describedby]="describedBy() ?? null"
  [attr.aria-invalid]="ariaInvalid() || null"
  (input)="onInput(control.value)"
/>
