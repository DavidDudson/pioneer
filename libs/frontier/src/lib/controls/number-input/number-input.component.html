<fr-input
  type="number"
  inputMode="numeric"
  numeric
  [step]="1"
  [min]="min()"
  [max]="max()"
  [value]="value().toString()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  [ariaLabel]="ariaLabel()"
  (typed)="onInput($event)"
  (committed)="committed.emit()"
  (cancelled)="cancelled.emit()"
/>
