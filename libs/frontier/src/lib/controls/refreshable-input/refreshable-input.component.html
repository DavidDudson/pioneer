<fr-input-group [disabled]="disabled()" [invalid]="ariaInvalid() || failed()" [status]="status()">
  <fr-input
    type="text"
    [ariaLabel]="ariaLabel()"
    [disabled]="disabled()"
    [invalid]="ariaInvalid() || failed()"
    [placeholder]="placeholder()"
    [value]="value()"
    (typed)="value.set($event)"
  />
  <fr-input-addon action>
    <ng-content select="[frAction]" />
    <fr-button
      variant="ghost"
      size="sm"
      iconOnly
      [disabled]="disabled() || loading()"
      [ariaLabel]="'frontier.refreshableInput.refresh' | transloco"
      (pressed)="refresh()"
    >
      <fr-icon [icon]="RefreshIcon" />
    </fr-button>
  </fr-input-addon>
</fr-input-group>
