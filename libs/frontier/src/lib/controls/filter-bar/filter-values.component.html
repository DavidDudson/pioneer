@if (bounded()) {
  <fr-filter-bound-values [field]="field()" [operator]="operator()" [(values)]="values" />
} @else {
  @switch (field().kind) {
    @case (Kind.Text) {
      <fr-search-input
        [value]="text()"
        [ariaLabel]="field().label"
        [placeholder]="'frontier.filterBar.text' | transloco"
        (searched)="setText($event)"
      />
    }
    @case (Kind.Flag) {
      <fr-segmented
        [options]="options()"
        [value]="values()[0]"
        [ariaLabel]="field().label"
        (valueChange)="setFlag($event)"
      />
    }
    @default {
      <fr-filter-set-values
        [field]="field()"
        [operator]="operator()"
        [(values)]="values"
        (searched)="searched.emit($event)"
        (moreRequested)="moreRequested.emit()"
      />
    }
  }
}
