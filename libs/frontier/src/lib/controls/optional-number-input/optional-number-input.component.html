<fr-input
  type="number"
  numeric
  [inputMode]="inputMode()"
  [step]="step()"
  [min]="min()"
  [max]="max()"
  [value]="text()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  [ariaLabel]="ariaLabel()"
  (typed)="onInput($event)"
  (committed)="committed.emit()"
  (cancelled)="cancelled.emit()"
/>
