<fr-input
  type="text"
  [monospace]="monospace()"
  [adornment]="trailing() ? 'pair' : 'none'"
  [value]="value()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  [ariaLabel]="ariaLabel()"
  (typed)="value.set($event)"
  (committed)="committed.emit()"
  (cancelled)="cancelled.emit()"
/>
