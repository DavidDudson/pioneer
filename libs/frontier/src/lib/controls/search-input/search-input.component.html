<fr-input-group [disabled]="disabled()" [invalid]="invalid()">
  <fr-input-addon><fr-icon [icon]="SearchIcon" /></fr-input-addon>
  <fr-input
    type="search"
    enterKeyHint="search"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [invalid]="invalid()"
    [ariaLabel]="ariaLabel()"
    (typed)="type($event)"
    (committed)="commit()"
    (cancelled)="cancel()"
  />
  @if (clearable()) {
    <fr-input-addon action>
      <fr-button
        variant="ghost"
        size="sm"
        iconOnly
        [ariaLabel]="'frontier.searchInput.clear' | transloco"
        (pressed)="clearAndFocus()"
        ><fr-icon [icon]="ClearIcon"
      /></fr-button>
    </fr-input-addon>
  }
</fr-input-group>
