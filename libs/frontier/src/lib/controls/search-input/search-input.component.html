<span [class]="iconSlotClasses()"><fr-icon [icon]="SearchIcon" /></span>
<fr-input
  type="search"
  enterKeyHint="search"
  adornment="both"
  [value]="value()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  [ariaLabel]="ariaLabel()"
  (typed)="type($event)"
  (committed)="commit()"
  (cancelled)="cancel()"
/>
@if (clearable()) {
  <span [class]="clearSlotClasses">
    <fr-button
      variant="ghost"
      size="sm"
      iconOnly
      [ariaLabel]="'frontier.searchInput.clear' | transloco"
      (pressed)="clearAndFocus()"
      ><fr-icon [icon]="ClearIcon"
    /></fr-button>
  </span>
}
