<div
  role="toolbar"
  frRovingFocus="horizontal"
  rovingWrap
  [class]="trackClasses()"
  [attr.id]="id() ?? null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="labelledBy() ?? null"
  [attr.aria-describedby]="describedBy() ?? null"
  [attr.aria-invalid]="ariaInvalid() || null"
>
  @for (option of options(); track option.value) {
    <fr-button
      frRovingFocusItem
      [rovingSelected]="option.value === value()"
      [variant]="variant"
      [size]="size()"
      [disabled]="disabled()"
      [toggled]="option.value === value()"
      [iconOnly]="option.icon !== undefined"
      [ariaLabel]="option.icon === undefined ? undefined : option.label"
      (pressed)="choose(option.value)"
    >
      @if (option.icon; as icon) {
        <fr-icon [icon]="icon" />
      } @else {
        {{ option.label }}
      }
    </fr-button>
  }
</div>
