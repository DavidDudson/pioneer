<input
  #combobox="ngCombobox"
  ngCombobox
  type="text"
  autocomplete="off"
  [class]="inputClasses"
  [attr.id]="id() ?? null"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [softDisabled]="false"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-describedby]="describedBy() ?? null"
  [attr.aria-invalid]="ariaInvalid() || null"
  [value]="text()"
  [expanded]="expanded()"
  (valueChange)="type($event)"
  (expandedChange)="expandedChange($event)"
  (keydown.escape)="escape()"
  (keydown.enter)="enter()"
/>

<ng-template ngComboboxPopup [combobox]="combobox">
  <div
    #virtual="frVirtualRows"
    [class]="popupClasses()"
    [frVirtualRows]="keys()"
    [activeIndex]="activeIndex()"
    [pickedIndex]="pickedIndex()"
    [resetOn]="options()"
    [suspended]="loading()"
  >
    <fr-combobox-status [loading]="loading()" [empty]="options().length === 0" />
    <!-- Inline styles: the virtualizer measures options at runtime, so the listbox's height can't be a token. -->
    <!-- eslint-disable pioneer/no-template-styling, @angular-eslint/template/no-inline-styles -- runtime-measured listbox height -->
    <div
      #listbox="ngListbox"
      ngListbox
      ngComboboxWidget
      focusMode="activedescendant"
      selectionMode="explicit"
      [activeDescendant]="listbox.activeDescendant()"
      [wrap]="false"
      [class]="listboxClasses"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-labelledby]="labelledBy() ?? null"
      [attr.aria-busy]="loading() || null"
      [style.height.px]="virtual.totalSize()"
      [value]="selected()"
      (valueChange)="choose($event)"
    >
      <!-- While loading, the skeleton replaces the last query's options rather than sitting above them. -->
      @for (row of virtual.rows(); track row.key) {
        @if (optionAt(row.index); as option) {
          <div
            ngOption
            [frVirtualRow]="row"
            [class]="optionClasses"
            [value]="option.value"
            [label]="option.label"
            [disabled]="option.disabled ?? false"
            [attr.aria-setsize]="options().length"
            [attr.aria-posinset]="row.index + 1"
          >
            {{ option.label }}
            @if (option.description !== undefined) {
              <span [class]="descriptionClasses">{{ option.description }}</span>
            }
            @if (option.tags !== undefined && option.tags.length > 0) {
              <span [class]="tagsClasses">
                @for (tag of option.tags; track $index) {
                  <fr-badge [tone]="tag.tone ?? neutral">{{ tag.label }}</fr-badge>
                }
              </span>
            }
          </div>
        }
      }
    </div>
    <!-- eslint-enable pioneer/no-template-styling, @angular-eslint/template/no-inline-styles -->
  </div>
</ng-template>
