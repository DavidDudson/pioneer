<ng-template #content>
  <ng-content />
  @if (busy()) {
    <span [class]="loadingClasses">{{ 'frontier.async.loading' | transloco }}</span>
  }
</ng-template>
@switch (level()) {
  @case (1) {
    <h1 [class]="classes()" [attr.aria-busy]="busy() || null"><ng-container [ngTemplateOutlet]="content" /></h1>
  }
  @case (2) {
    <h2 [class]="classes()" [attr.aria-busy]="busy() || null"><ng-container [ngTemplateOutlet]="content" /></h2>
  }
  @case (3) {
    <h3 [class]="classes()" [attr.aria-busy]="busy() || null"><ng-container [ngTemplateOutlet]="content" /></h3>
  }
  @default {
    <h4 [class]="classes()" [attr.aria-busy]="busy() || null"><ng-container [ngTemplateOutlet]="content" /></h4>
  }
}
