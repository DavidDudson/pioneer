<ng-template #content><ng-content /></ng-template>
@if (phraseElement(); as phrase) {
  <fr-text-phrase [element]="phrase" [classes]="classes()" [expansion]="expansion()"
    ><ng-container [ngTemplateOutlet]="content"
  /></fr-text-phrase>
} @else if (element() === 'p') {
  <p [class]="classes()"><ng-container [ngTemplateOutlet]="content" /></p>
} @else {
  <span [class]="classes()"><ng-container [ngTemplateOutlet]="content" /></span>
}
