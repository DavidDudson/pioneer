<ng-template #content><ng-content /></ng-template>
@switch (element()) {
  @case ('code') {
    <code [class]="classes()"><ng-container [ngTemplateOutlet]="content" /></code>
  }
  @case ('kbd') {
    <kbd [class]="classes()"><ng-container [ngTemplateOutlet]="content" /></kbd>
  }
  @case ('abbr') {
    <abbr [class]="classes()" [attr.title]="expansion()"><ng-container [ngTemplateOutlet]="content" /></abbr>
  }
  @default {
    <q [class]="classes()"><ng-container [ngTemplateOutlet]="content" /></q>
  }
}
