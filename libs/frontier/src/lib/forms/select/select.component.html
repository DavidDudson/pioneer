<fr-field #field [label]="label()" [hint]="hint()" [error]="message()" [hideLabel]="hideLabel()">
  <button
    #combobox="ngCombobox"
    #origin="cdkOverlayOrigin"
    type="button"
    ngCombobox
    cdkOverlayOrigin
    [id]="field.controlId()"
    [class]="triggerClasses"
    [disabled]="disabled()"
    [attr.aria-invalid]="message() === undefined ? null : true"
    [(expanded)]="expanded"
    (keydown.escape)="cancelled.emit()"
  >
    <span [class.text-fg-subtle]="selected().length === 0">{{ selectedLabel() }}</span>
    <span aria-hidden="true" class="text-fg-subtle">▾</span>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="expanded()"
    [cdkConnectedOverlayMinWidth]="origin.elementRef.nativeElement.offsetWidth"
  >
    <ng-template ngComboboxPopup [combobox]="combobox">
      <div
        #listbox="ngListbox"
        ngListbox
        ngComboboxWidget
        focusMode="activedescendant"
        selectionMode="explicit"
        class="z-20 mt-2xs max-h-[16rem] overflow-auto rounded-overlay border border-line-subtle bg-surface-overlay p-2xs shadow-overlay"
        [value]="selected()"
        (valueChange)="choose($event)"
      >
        @for (option of options(); track option.value) {
          <div
            ngOption
            class="cursor-pointer rounded-control px-sm py-sm text-body aria-selected:bg-accent-subtle aria-selected:text-accent-fg data-[active=true]:bg-surface-sunken pointer-fine:py-xs"
            [value]="option.value"
            [label]="option.label"
          >
            {{ option.label }}
          </div>
        }
      </div>
    </ng-template>
  </ng-template>
</fr-field>
