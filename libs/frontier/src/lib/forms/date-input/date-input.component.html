<fr-field #field [label]="label()" [hint]="hint()" [error]="message()">
  <input
    #control
    type="date"
    [id]="field.controlId()"
    [class]="controlClasses"
    [value]="iso()"
    [disabled]="disabled()"
    [attr.aria-invalid]="message() === undefined ? null : true"
    (input)="onInput(control.value)"
  />
</fr-field>
