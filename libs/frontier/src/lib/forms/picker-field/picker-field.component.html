<fr-field [invalid]="message() !== undefined">
  <fr-label [visuallyHidden]="hideLabel()">{{ label() }}</fr-label>
  <fr-picker
    [disabled]="disabled()"
    [rows]="rows()"
    [columns]="columns()"
    [rowValue]="rowValue()"
    [rowLabel]="rowLabel()"
    [rowDisabled]="rowDisabled()"
    [loading]="loading()"
    [loadingMore]="loadingMore()"
    [hasMore]="hasMore()"
    [placeholder]="placeholder()"
    [(value)]="value"
    (searched)="searched.emit($event)"
    (sorted)="sorted.emit($event)"
    (loadMore)="loadMore.emit()"
  />
  @if (message(); as message) {
    <fr-field-error>{{ message }}</fr-field-error>
  } @else if (hint(); as hint) {
    <fr-field-hint>{{ hint }}</fr-field-hint>
  }
</fr-field>
