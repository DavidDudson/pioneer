<span [class]="classes()" [attr.role]="role()" [attr.id]="id() ?? null">
  @if (icon(); as icon) {
    <span [class]="iconClasses"><fr-icon size="md" [icon]="icon" /></span>
  }
  <span [class]="bodyClasses"><ng-content /></span>
  @if (dismissible()) {
    <fr-button
      iconOnly
      size="xs"
      [variant]="ButtonVariant.Ghost"
      [ariaLabel]="'frontier.alert.dismiss' | transloco"
      (pressed)="dismiss()"
    >
      <fr-icon [icon]="closeIcon" />
    </fr-button>
  }
</span>
