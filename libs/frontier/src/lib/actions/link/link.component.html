<ng-template #content><ng-content /></ng-template>
@if (href(); as href) {
  <!-- eslint-disable-next-line pioneer/no-interruptions -- external only: consumers' literal `href` is linted, and bound hrefs on fr-link are banned. -->
  <a rel="noopener" [class]="classes()" [href]="href" [attr.aria-label]="ariaLabel()"
    ><ng-container [ngTemplateOutlet]="content"
  /></a>
} @else if (external() !== undefined) {
  @if (externalUrl(); as url) {
    <!-- eslint-disable-next-line pioneer/no-interruptions -- external only: externalUrl() is http(s) or undefined. -->
    <a rel="noopener" [class]="classes()" [href]="url" [attr.aria-label]="ariaLabel()"
      ><ng-container [ngTemplateOutlet]="content"
    /></a>
  } @else {
    <ng-container [ngTemplateOutlet]="content" />
  }
} @else {
  <a [class]="classes()" [routerLink]="to()" [attr.aria-label]="ariaLabel()"
    ><ng-container [ngTemplateOutlet]="content"
  /></a>
}
