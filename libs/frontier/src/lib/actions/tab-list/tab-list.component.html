<div role="tablist" frRovingFocus="horizontal" rovingWrap [class]="rowClasses" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="tab"
      frRovingFocusItem
      [rovingSelected]="option.value === value()"
      [class]="option.value === value() ? selectedClasses : otherClasses"
      [attr.aria-selected]="option.value === value()"
      (click)="choose(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
