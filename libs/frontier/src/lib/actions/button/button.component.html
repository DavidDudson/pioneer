<button
  [attr.type]="type()"
  [class]="classes()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-describedby]="describedBy() ?? null"
  [attr.aria-pressed]="toggled() ?? null"
  [attr.aria-busy]="busy() || null"
  [attr.aria-disabled]="busy() || null"
  (click)="press($event)"
>
  @if (toggled()) {
    <fr-icon [icon]="TickIcon" />
  }
  <ng-content />
</button>
