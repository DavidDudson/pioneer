<fr-stack gap="3xs" align="start">
  <fr-button
    [variant]="shownVariant()"
    [size]="size()"
    [type]="type()"
    [disabled]="disabled()"
    [iconOnly]="iconOnly()"
    [ariaLabel]="ariaLabel()"
    [busy]="state().isPending()"
    [status]="state().status()"
    [describedBy]="describedByIds()"
    (pressed)="press()"
  >
    <fr-async-indicator
      announceOnly
      [status]="state().status()"
      [pendingLabel]="pendingLabel()"
      [successLabel]="successLabel()"
    />
    <span [hidden]="asking()"><ng-content /></span>
    @if (asking()) {
      <span>{{ confirmLabel() }}</span>
    }
  </fr-button>
  @if (state().errorMessage(); as message) {
    <fr-message [id]="errorId">{{ message }}</fr-message>
  }
</fr-stack>
