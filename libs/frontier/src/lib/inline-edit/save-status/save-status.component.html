<fr-async-indicator
  showLabel
  [status]="indicatorStatus()"
  [pendingLabel]="'frontier.saveStatus.saving' | transloco: { label: label() }"
  [successLabel]="'frontier.saveStatus.saved' | transloco"
/>
@if (edit().canRevert()) {
  <fr-button
    variant="ghost"
    size="sm"
    iconOnly
    [ariaLabel]="'frontier.saveStatus.revert' | transloco"
    (pressed)="edit().revert()"
  >
    <fr-icon [icon]="RevertIcon" />
  </fr-button>
}
