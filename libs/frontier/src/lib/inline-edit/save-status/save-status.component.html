<fr-async-indicator
  showLabel
  [status]="indicatorStatus()"
  [pendingLabel]="'frontier.saveStatus.saving' | transloco: { label: label() }"
  [successLabel]="'frontier.saveStatus.saved' | transloco"
/>
@if (edit().canRevert()) {
  <fr-button variant="ghost" size="sm" (pressed)="edit().revert()">{{
    'frontier.saveStatus.revert' | transloco
  }}</fr-button>
}
