<fr-stack gap="3xs">
  <fr-text variant="caption" tone="subtle">{{ label() }}</fr-text>

  @if (status() === Status.Loading) {
    <fr-skeleton width="md" />
  } @else {
    <fr-stack align="center" direction="horizontal" gap="xs">
      @if (edit().open()) {
        <fr-stack #editor grow (focusout)="focusOut($event)">
          <ng-content select="[frInlineEditor]" />
        </fr-stack>
      } @else {
        <fr-button variant="inline" [ariaLabel]="`Edit ${label()}: ${edit().display()}`" (pressed)="edit().edit()">
          {{ edit().display() }}
        </fr-button>
      }
      <fr-save-status [edit]="edit()" [label]="label()" />
    </fr-stack>
    @if (message(); as message) {
      <fr-message [tone]="messageTone()">{{ message }}</fr-message>
    }
  }
</fr-stack>
