<fr-section anchor="lazy-first" heading="First" [concealed]="shown() !== 'first'">
  <ng-template frSectionBody><span id="first-body"></span></ng-template>
</fr-section>
<fr-section anchor="lazy-second" heading="Second" [concealed]="shown() !== 'second'">
  <ng-template frSectionBody><span id="second-body"></span></ng-template>
</fr-section>
