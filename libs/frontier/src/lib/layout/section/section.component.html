<section [attr.aria-labelledby]="anchor()">
  <fr-card headingVariant="subheading" [padding]="padding" [heading]="heading()" [level]="2" [anchor]="anchor()">
    <fr-card-content>
      <fr-stack gap="md">
        <ng-content />
        @if (opened() && body(); as body) {
          <ng-container [ngTemplateOutlet]="body.template" />
        }
        @if (opened() && data(); as data) {
          <fr-async-view
            [query]="data.query()"
            [pendingTemplate]="pendingSlot()?.template"
            [dataTemplate]="data.template"
            [errorTemplate]="errorSlot()?.template"
            [emptyTemplate]="emptySlot()?.template"
            [filteredEmptyTemplate]="filteredEmptySlot()?.template"
            [errorMessage]="errorMessage()"
            [filtered]="filtered()"
            [detectEmpty]="true"
            (cleared)="cleared.emit()"
          />
        }
      </fr-stack>
    </fr-card-content>
  </fr-card>
</section>
