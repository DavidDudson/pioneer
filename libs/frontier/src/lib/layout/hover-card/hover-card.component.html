<!-- The span only listens, unless given a `focusLabel`, when it is also the tab stop. Pointer and focus events from the projected trigger bubble to it. -->
<span
  #origin="cdkOverlayOrigin"
  cdkOverlayOrigin
  [class]="triggerClasses"
  [attr.aria-describedby]="open() ? id : null"
  [attr.tabindex]="focusLabel() === undefined ? null : 0"
  [attr.role]="focusLabel() === undefined ? null : 'group'"
  [attr.aria-label]="focusLabel()"
  (mouseenter)="pointer(true)"
  (mouseleave)="pointer(false)"
  (focusin)="focus(true)"
  (focusout)="focus(false)"
  (keydown.escape)="escape()"
>
  <ng-content />
</span>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  (overlayKeydown)="$event.key === 'Escape' && escape()"
>
  <div role="tooltip" [id]="id" [class]="cardClasses" (mouseenter)="pointer(true)" (mouseleave)="pointer(false)">
    @if (content(); as card) {
      <ng-container *ngTemplateOutlet="card.template" />
    }
  </div>
</ng-template>
