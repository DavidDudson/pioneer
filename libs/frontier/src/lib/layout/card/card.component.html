@if (showHeader()) {
  <fr-card-header
    [heading]="heading()"
    [description]="description()"
    [level]="level()"
    [headingVariant]="headingVariant()"
    [anchor]="anchor()"
  >
    <ng-content select="[frCardActions]" />
  </fr-card-header>
}
<ng-content />
@if (footerPart()) {
  <fr-divider />
}
<ng-content select="fr-card-footer" />
