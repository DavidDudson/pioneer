<fr-box width="page" padding="lg" gutter>
  <fr-stack gap="xl">
    <header>
      <fr-stack horizontalFrom="md" gap="md" justify="between">
        <fr-stack gap="2xs">
          @if (title(); as title) {
            <h1 frText="title">{{ title }}</h1>
          } @else {
            <h1 frText="title" aria-busy="true"><fr-skeleton width="md" /></h1>
          }
          @if (description(); as description) {
            <p frText tone="muted">{{ description }}</p>
          }
        </fr-stack>
        <ng-content select="[frPageActions]" />
      </fr-stack>
    </header>
    <main>
      <ng-content />
    </main>
  </fr-stack>
</fr-box>
