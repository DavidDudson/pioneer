<header class="sticky top-none z-10 border-b border-line-subtle bg-surface-base pt-[env(safe-area-inset-top)]">
  <fr-box width="page" padding="sm" gutter>
    <fr-stack direction="horizontal" align="center" justify="between">
      <span frText="subheading" class="shrink-0 font-display">{{ brand() }}</span>
      <nav aria-label="Main" class="min-w-0 overflow-x-auto"><ng-content select="[frShellNav]" /></nav>
    </fr-stack>
  </fr-box>
</header>
<div class="flex-1"><ng-content /></div>
<footer class="border-t border-line-subtle bg-surface-base pb-[env(safe-area-inset-bottom)]">
  <fr-box width="page" padding="md" gutter>
    <ng-content select="[frShellFooter]" />
  </fr-box>
</footer>
