<header #header [class]="headerClasses">
  <span [class]="skipLinkClasses"
    ><fr-link [skipTo]="mainId">{{ 'frontier.shell.skipToContent' | transloco }}</fr-link></span
  >
  <fr-box width="page" padding="sm" gutter>
    <fr-stack direction="horizontal" align="center" gap="md">
      <span [class]="brandClasses"
        ><fr-stack direction="horizontal" align="center" gap="xs">
          <fr-text variant="brand">{{ brand() }}</fr-text>
          @if (badge(); as badge) {
            <fr-badge tone="accent">{{ badge }}</fr-badge>
          }
        </fr-stack></span
      >
      @if (!searchOpen()) {
        <div [class]="crumbsClasses">
          @if (crumbs.trail().length > 0) {
            <fr-breadcrumbs [items]="crumbs.trail()" />
          }
        </div>
        @if (searchAvailable()) {
          <span #searchButton [class]="actionsClasses"
            ><fr-button
              variant="ghost"
              iconOnly
              [ariaLabel]="'frontier.shell.openSearch' | transloco"
              (pressed)="openSearch()"
              ><fr-icon [icon]="searchIcon" /></fr-button
          ></span>
        }
      }
      <div #searchSlot [class]="searchClasses()"><ng-content select="[frShellSearch]" /></div>
      <div [class]="actionsClasses"><ng-content select="[frShellActions]" /></div>
      @if (panelAvailable()) {
        <span [class]="actionsClasses"
          ><fr-dropdown [align]="menuAlign" [label]="'frontier.shell.menu' | transloco" [icon]="menuIcon">
            <fr-button [variant]="menuVariant" (pressed)="togglePanel()">{{
              panelToggleKey() | transloco: { panel: panelLabel() }
            }}</fr-button>
          </fr-dropdown></span
        >
      }
    </fr-stack>
  </fr-box>
</header>
<main tabindex="-1" [id]="mainId" [class]="contentClasses()"><ng-content /></main>
<aside [attr.aria-label]="panelLabel()" [class]="panelClasses()"><ng-content select="[frShellPanel]" /></aside>
<footer [class]="footerClasses">
  <fr-box width="page" padding="md" gutter>
    <ng-content select="[frShellFooter]" />
  </fr-box>
</footer>
