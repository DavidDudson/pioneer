<fr-stack gap="md">
  <fr-inline-field [label]="'character.sheet.deity.label' | transloco" [edit]="field()">
    <pio-deity-picker
      frInlineEditor
      [rows]="rows()"
      [ariaLabel]="'character.sheet.deity.label' | transloco"
      [placeholder]="'character.sheet.deity.placeholder' | transloco"
      [value]="field().draft()"
      (valueChange)="field().change($event)"
      (committed)="field().flushSoon()"
      (cancelled)="field().cancel()"
    />
  </fr-inline-field>
  <pio-deity [deity]="line()" [loading]="loading()" />
</fr-stack>
