<fr-rail hiddenNarrow [label]="'character.sheet.panels.label' | transloco">
  <fr-stack gap="md">
    <pio-sheet-resources pool="hero-points" />

    @for (entry of panels; track entry.panel) {
      <fr-disclosure [variant]="bordered" [open]="true">
        <fr-text frDisclosureSummary>{{ entry.headingKey | transloco }}</fr-text>
        <pio-sheet-panel [panel]="entry.panel" />
      </fr-disclosure>
    }
  </fr-stack>
</fr-rail>
