<fr-stack gap="lg">
  <fr-section
    [concealed]="shown()?.anchor !== sections.variantRules.anchor"
    [anchor]="sections.variantRules.anchor"
    [heading]="sections.variantRules.headingKey | transloco"
  >
    <pio-sheet-variant-rules />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.ruleLimits.anchor"
    [anchor]="sections.ruleLimits.anchor"
    [heading]="sections.ruleLimits.headingKey | transloco"
  >
    <pio-sheet-rule-limits />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.overrides.anchor"
    [anchor]="sections.overrides.anchor"
    [heading]="sections.overrides.headingKey | transloco"
  >
    <pio-sheet-overrides />
  </fr-section>

  <fr-section [anchor]="sections.customEffects.anchor" [heading]="sections.customEffects.headingKey | transloco">
    <pio-sheet-custom-effects />
  </fr-section>
</fr-stack>
