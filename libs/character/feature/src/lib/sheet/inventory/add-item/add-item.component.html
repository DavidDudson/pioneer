<fr-async-form [form]="form" [action]="add" [describeError]="describeError">
  <fr-stack gap="sm">
    <fr-heading variant="subheading" [level]="3">{{ 'character.sheet.inventory.addHeading' | transloco }}</fr-heading>
    <fr-grid [columns]="3">
      <fr-combobox-field
        [label]="'character.sheet.inventory.item' | transloco"
        [placeholder]="'character.sheet.inventory.itemPlaceholder' | transloco"
        [options]="items()"
        [formField]="form.item"
        (searched)="search($event)"
      />
      <fr-number-field [label]="'character.sheet.inventory.quantity' | transloco" [formField]="form.quantity" />
      <fr-select-field
        [label]="'character.sheet.inventory.place' | transloco"
        [options]="places()"
        [formField]="form.container"
      />
    </fr-grid>
    <fr-stack direction="horizontal" justify="end">
      <fr-async-button
        type="submit"
        variant="primary"
        [pendingLabel]="'character.sheet.inventory.adding' | transloco"
        [successLabel]="'character.sheet.inventory.added' | transloco"
      >
        {{ 'character.sheet.inventory.add' | transloco }}
      </fr-async-button>
    </fr-stack>
  </fr-stack>
</fr-async-form>
