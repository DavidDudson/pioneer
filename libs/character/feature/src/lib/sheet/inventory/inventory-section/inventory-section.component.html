<fr-stack gap="lg">
  <fr-async-region [errorMessage]="'character.sheet.inventory.loadError' | transloco">
    <ng-template frAsyncPending><pio-inventory [groups]="undefined" /></ng-template>
    <ng-template [frAsyncData]="items">
      @if (content(); as content) {
        <fr-stack gap="lg">
          <pio-inventory [groups]="groups()" [actions]="itemEdits" />
          <ng-template #itemEdits let-line>
            <fr-stack gap="xs">
              <pio-item-edits
                [id]="line.id"
                [name]="names().get(line.id) ?? ('rules.inventory.unknownItem' | transloco)"
                [content]="content"
              />
              <pio-item-offer
                [id]="line.id"
                [name]="names().get(line.id) ?? ('rules.inventory.unknownItem' | transloco)"
              />
              @if (runed(); as runed) {
                <pio-item-rune-edits
                  [id]="line.id"
                  [name]="names().get(line.id) ?? ('rules.inventory.unknownItem' | transloco)"
                  [content]="runed"
                />
              }
            </fr-stack>
          </ng-template>
        </fr-stack>
      }
    </ng-template>
  </fr-async-region>
  <pio-custom-items />
  <pio-party-inventory [names]="names()" />
  <fr-stack gap="sm">
    <fr-heading variant="subheading" [level]="3">{{ 'character.sheet.inventory.bulkHeading' | transloco }}</fr-heading>
    <fr-async-region [errorMessage]="'character.sheet.inventory.loadError' | transloco">
      <ng-template frAsyncPending><pio-bulk [bulk]="undefined" /></ng-template>
      <ng-template [frAsyncData]="attributes"><pio-bulk [bulk]="bulk()" /></ng-template>
    </fr-async-region>
  </fr-stack>
  <fr-stack gap="sm">
    <fr-heading variant="subheading" [level]="3">{{
      'character.sheet.inventory.investmentsHeading' | transloco
    }}</fr-heading>
    <fr-async-region [errorMessage]="'character.sheet.inventory.loadError' | transloco">
      <ng-template frAsyncPending><pio-investments [investments]="undefined" [maximum]="investedMax()" /></ng-template>
      <ng-template [frAsyncData]="engine()"
        ><pio-investments [investments]="investments()" [maximum]="investedMax()"
      /></ng-template>
    </fr-async-region>
  </fr-stack>
  <pio-coins-section />
</fr-stack>
