@if (runes.all().length > 0 && targets.all().length > 0) {
  <fr-async-form [form]="form" [action]="move" [describeError]="describeError">
    <fr-stack direction="horizontal" gap="sm" align="end" wrap>
      <fr-picker-field
        [label]="'character.sheet.runes.moveRuneOf' | transloco: { name: name() }"
        [rows]="runes.shown()"
        [columns]="runeColumns()"
        [rowValue]="runeValue"
        [rowLabel]="runeLabel"
        [formField]="form.rune"
        (searched)="runes.query.set($event)"
        (sorted)="runes.ordering.set($event)"
      />
      <fr-picker-field
        [label]="'character.sheet.runes.moveOnto' | transloco: { name: name() }"
        [rows]="targets.shown()"
        [columns]="targetColumns()"
        [rowValue]="targetValue"
        [rowLabel]="targetLabel"
        [formField]="form.to"
        (searched)="targets.query.set($event)"
        (sorted)="targets.ordering.set($event)"
      />
      <fr-async-button type="submit" size="sm" [pendingLabel]="'character.sheet.runes.moving' | transloco">
        {{ 'character.sheet.runes.move' | transloco: { name: name() } }}
      </fr-async-button>
    </fr-stack>
  </fr-async-form>
}
