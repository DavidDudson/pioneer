<fr-stack gap="lg">
  <pio-sheet-section-tabs [sections]="sectionOrder" />

  <fr-section
    [concealed]="shown()?.anchor !== sections.roleplay.anchor"
    [anchor]="sections.roleplay.anchor"
    [heading]="sections.roleplay.headingKey | transloco"
  >
    <pio-sheet-roleplay-section />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.explorationActivity.anchor"
    [anchor]="sections.explorationActivity.anchor"
    [heading]="sections.explorationActivity.headingKey | transloco"
  >
    <pio-sheet-exploration-activity />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.environments.anchor"
    [anchor]="sections.environments.anchor"
    [heading]="sections.environments.headingKey | transloco"
  >
    <pio-sheet-environments />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.actions.anchor"
    [anchor]="sections.actions.anchor"
    [heading]="sections.actions.headingKey | transloco"
  >
    <pio-sheet-actions [mode]="Mode" />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.deity.anchor"
    [anchor]="sections.deity.anchor"
    [heading]="sections.deity.headingKey | transloco"
  >
    <fr-async-region>
      <ng-template frAsyncPending><pio-deity loading /></ng-template>
      <ng-template let-content [frAsyncData]="sheet.registry">
        <pio-sheet-deity-section [field]="deity" [registry]="content" />
      </ng-template>
    </fr-async-region>
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.languages.anchor"
    [anchor]="sections.languages.anchor"
    [heading]="sections.languages.headingKey | transloco"
  >
    <pio-sheet-languages-section />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.inventory.anchor"
    [anchor]="sections.inventory.anchor"
    [heading]="sections.inventory.headingKey | transloco"
  >
    <pio-inventory-section
      [investments]="sheet.investments()"
      [engine]="sheet.engineQuery()"
      [melded]="sheet.melded()"
    />
  </fr-section>
</fr-stack>
