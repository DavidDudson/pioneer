<fr-stack direction="horizontal" align="center" gap="sm" wrap>
  <pio-option-picker
    [ariaLabel]="'character.sheet.effects.pick' | transloco"
    [placeholder]="'character.sheet.effects.pick' | transloco"
    [options]="choices()"
    [value]="picked()"
    (valueChange)="choose($event)"
  />
  @if (forms().length > 0) {
    <pio-option-picker
      [ariaLabel]="'character.sheet.effects.formPick' | transloco"
      [placeholder]="'character.sheet.effects.formPick' | transloco"
      [options]="forms()"
      [value]="form()"
      (valueChange)="form.set($event)"
    />
  }
  @if (ranks().length > 0) {
    <pio-option-picker
      [ariaLabel]="'character.sheet.effects.rankPick' | transloco"
      [options]="ranks()"
      [value]="rank()"
      (valueChange)="setRank($event)"
    />
  }
  @if (traditions().length > 0) {
    <pio-option-picker
      [ariaLabel]="'character.sheet.effects.traditionPick' | transloco"
      [placeholder]="'character.sheet.effects.traditionPick' | transloco"
      [options]="traditions()"
      [value]="tradition()"
      (valueChange)="tradition.set($event)"
    />
  }
  <pio-sheet-effect-spell [spells]="spells()" [value]="spell()" (valueChange)="spell.set($event)" />
  <pio-option-picker
    [ariaLabel]="'character.sheet.effects.source' | transloco"
    [options]="sources()"
    [value]="sourceKind()"
    (valueChange)="setSource($event)"
  />
  @if (isAlly() && hasParty()) {
    <pio-option-picker
      [ariaLabel]="'character.sheet.effects.allyPick' | transloco"
      [placeholder]="'character.sheet.effects.allyPick' | transloco"
      [options]="allyOptions()"
      [value]="allyChoice()"
      (valueChange)="allyChoice.set($event)"
    />
  }
  @if (typesAlly()) {
    <fr-text-input
      [placeholder]="'character.sheet.effects.allyName' | transloco"
      [value]="allyName()"
      (valueChange)="allyName.set($event)"
    />
  }
  <fr-async-button size="sm" [action]="add" [disabled]="busy() || !canAdd()" [describeError]="describeError()">
    {{ 'character.sheet.effects.add' | transloco }}
  </fr-async-button>
</fr-stack>
