<fr-stack direction="horizontal" align="center" gap="sm" wrap>
  <fr-select
    [ariaLabel]="'character.sheet.effects.pick' | transloco"
    [placeholder]="'character.sheet.effects.pick' | transloco"
    [options]="choices()"
    [value]="picked()"
    (valueChange)="picked.set($event)"
  />
  <fr-select
    [ariaLabel]="'character.sheet.effects.source' | transloco"
    [options]="sources()"
    [value]="sourceKind()"
    (valueChange)="setSource($event)"
  />
  @if (isAlly() && hasParty()) {
    <fr-select
      [ariaLabel]="'character.sheet.effects.allyPick' | transloco"
      [placeholder]="'character.sheet.effects.allyPick' | transloco"
      [options]="allyOptions()"
      [value]="allyChoice()"
      (valueChange)="allyChoice.set($event)"
    />
  }
  @if (typesAlly()) {
    <fr-text-input
      [placeholder]="'character.sheet.effects.allyName' | transloco"
      [value]="allyName()"
      (valueChange)="allyName.set($event)"
    />
  }
  <fr-async-button size="sm" [action]="add" [disabled]="busy() || !canAdd()" [describeError]="describeError()">
    {{ 'character.sheet.effects.add' | transloco }}
  </fr-async-button>
</fr-stack>
