<fr-async-region>
  <ng-template frAsyncPending><fr-skeleton width="lg" /></ng-template>
  <ng-template [frAsyncData]="playQuery">
    <fr-async-region>
      <ng-template frAsyncPending><fr-skeleton width="lg" /></ng-template>
      <ng-template [frAsyncData]="engineQuery()">
        @if (rows(); as rows) {
          <fr-stack gap="xs">
            @for (row of rows; track row.resource) {
              <fr-stack direction="horizontal" align="center" gap="sm" wrap>
                <fr-text weight="semibold">{{ row.labelKey | transloco }}</fr-text>
                <fr-pips
                  [ariaLabel]="row.labelKey | transloco"
                  [max]="row.max"
                  [value]="shown(row)"
                  [disabled]="busy()"
                  (valueChange)="set(row, $event)"
                />
              </fr-stack>
            }
            @if (error(); as message) {
              <fr-text tone="danger">{{ message }}</fr-text>
            }
          </fr-stack>
        } @else {
          <fr-skeleton width="lg" />
        }
      </ng-template>
    </fr-async-region>
  </ng-template>
</fr-async-region>
