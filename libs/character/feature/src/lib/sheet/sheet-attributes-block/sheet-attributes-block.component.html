@for (group of groups; track group[0]) {
  <fr-surface padding="xs">
    <fr-async-region>
      <ng-template frAsyncPending><pio-attribute-rolls [statistics]="undefined" [attributes]="group" /></ng-template>
      <ng-template [frAsyncData]="sheet.registry">
        <pio-attribute-rolls
          [statistics]="sheet.attributeChecks()"
          [attributes]="group"
          [entryNames]="picks.entryNames()"
          [originNames]="sheet.originNames()"
        />
      </ng-template>
    </fr-async-region>
  </fr-surface>
}
