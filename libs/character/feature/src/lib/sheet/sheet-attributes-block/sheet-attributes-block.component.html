<fr-surface padding="sm">
  <fr-async-region>
    <ng-template frAsyncPending><pio-attribute-rolls [modifiers]="undefined" /></ng-template>
    <ng-template [frAsyncData]="sheet.registry">
      <pio-attribute-rolls [modifiers]="picks.attributes()?.modifiers" (rolled)="roll($event)" />
    </ng-template>
  </fr-async-region>
</fr-surface>
