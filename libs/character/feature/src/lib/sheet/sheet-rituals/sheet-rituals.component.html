@if (rows().length > 0) {
  <fr-stack gap="2xs">
    <fr-heading variant="subheading" [level]="3">{{ 'character.sheet.rituals.heading' | transloco }}</fr-heading>
    <fr-list gap="xs">
      @for (row of rows(); track row.id) {
        <fr-list-item>
          <fr-text>{{ row.name ?? ('character.sheet.rituals.unknown' | transloco) }}</fr-text>
        </fr-list-item>
      }
    </fr-list>
  </fr-stack>
}
