<fr-grid [columns]="3">
  <fr-inline-field [label]="labels().class | transloco" [edit]="classField()">
    <pio-class-picker
      frInlineEditor
      [rows]="rows.classes()"
      [loading]="rows.loading()"
      [ariaLabel]="labels().class | transloco"
      [placeholder]="'character.sheet.classPlaceholder' | transloco"
      [value]="classField().draft()"
      (valueChange)="classField().change($event)"
      (committed)="classField().flushSoon()"
      (cancelled)="classField().cancel()"
    />
  </fr-inline-field>
  @if (classPicks().subclassField(); as subclassField) {
    <fr-inline-field [label]="labels().subclass | transloco" [edit]="subclassField">
      <pio-subclass-picker
        frInlineEditor
        [rows]="rows.subclasses()"
        [loading]="rows.loading()"
        [ariaLabel]="labels().subclass | transloco"
        [placeholder]="'character.sheet.subclassPlaceholder' | transloco"
        [value]="subclassField.draft()"
        (valueChange)="subclassField.change($event)"
        (committed)="subclassField.flushSoon()"
        (cancelled)="subclassField.cancel()"
      />
    </fr-inline-field>
  }
  @if (classPicks().keyAttributeField(); as keyAttributeField) {
    <fr-inline-field [label]="labels().keyAttribute | transloco" [edit]="keyAttributeField">
      <pio-key-attribute-picker
        frInlineEditor
        [rows]="rows.keyAttributes()"
        [loading]="rows.loading()"
        [ariaLabel]="labels().keyAttribute | transloco"
        [placeholder]="'character.sheet.keyAttributePlaceholder' | transloco"
        [value]="keyAttributeField.draft()"
        (valueChange)="keyAttributeField.change($event)"
        (committed)="keyAttributeField.flushSoon()"
        (cancelled)="keyAttributeField.cancel()"
      />
    </fr-inline-field>
  }
</fr-grid>
