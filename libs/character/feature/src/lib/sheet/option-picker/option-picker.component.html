<fr-picker
  [ariaLabel]="ariaLabel()"
  [placeholder]="placeholder()"
  [rows]="rows.shown()"
  [columns]="columns()"
  [rowValue]="rowValue"
  [rowLabel]="rowLabel"
  [value]="value()"
  (valueChange)="value.set($event)"
  (searched)="rows.query.set($event)"
  (sorted)="rows.ordering.set($event)"
/>
