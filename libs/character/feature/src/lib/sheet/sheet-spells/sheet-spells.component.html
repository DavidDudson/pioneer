@if (casts()) {
  <fr-async-region>
    <ng-template frAsyncPending>
      <fr-stack gap="md">
        @if (focuses()) {
          <pio-focus-spells [focus]="undefined" />
        }
        <fr-stack gap="sm">
          <fr-skeleton width="md" />
          <fr-grid [columns]="3">
            @for (slot of loadingSlots; track slot) {
              <fr-stack gap="3xs"><fr-skeleton width="sm" /><fr-skeleton width="md" /></fr-stack>
            }
          </fr-grid>
        </fr-stack>
        <pio-spell-access-list [lines]="undefined" />
      </fr-stack>
    </ng-template>
    <ng-template [frAsyncData]="spells">
      <fr-stack gap="md">
        <fr-segmented
          [options]="targetOptions()"
          [ariaLabel]="'character.sheet.spellTargets.label' | transloco"
          [(value)]="targetFilter"
        />
        @if (shownFocus(); as focusLine) {
          <pio-focus-spells [focus]="focusLine" />
        }
        <pio-sheet-prepared-spells [entries]="shownPrepared()" />
        @if (access(); as spellAccess) {
          <pio-spell-access [access]="spellAccess" />
        }
      </fr-stack>
    </ng-template>
  </fr-async-region>
}
