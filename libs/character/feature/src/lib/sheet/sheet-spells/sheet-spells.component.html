@if (casts()) {
  <pio-sheet-form-limits />
  <fr-async-region>
    <ng-template frAsyncPending>
      <fr-stack gap="md">
        <fr-stack gap="sm">
          <fr-skeleton width="md" />
          <fr-grid [columns]="3">
            <fr-stack gap="3xs"><fr-skeleton width="sm" /><fr-skeleton width="md" /></fr-stack>
            <fr-stack gap="3xs"><fr-skeleton width="sm" /><fr-skeleton width="md" /></fr-stack>
            <fr-stack gap="3xs"><fr-skeleton width="sm" /><fr-skeleton width="md" /></fr-stack>
          </fr-grid>
        </fr-stack>
      </fr-stack>
    </ng-template>
    <ng-template [frAsyncData]="spells">
      <fr-stack horizontalFrom="lg" gap="lg" align="start">
        <pio-sheet-spell-resources />
        <fr-stack gap="md" grow>
          <pio-spell-filter [groups]="filters.groups()" (changed)="filters.pick($event)" (cleared)="filters.clear()" />
          <pio-spell-row-list
            [lines]="filters.list()"
            [busy]="items.busy()"
            [error]="items.error()"
            (itemAction)="items.act($event)"
          />
          <pio-sheet-prepared-spells [entries]="prepared()" />
        </fr-stack>
      </fr-stack>
    </ng-template>
  </fr-async-region>
} @else if (filters.list().length > 0) {
  <pio-spell-row-list
    [lines]="filters.list()"
    [busy]="items.busy()"
    [error]="items.error()"
    (itemAction)="items.act($event)"
  />
}
