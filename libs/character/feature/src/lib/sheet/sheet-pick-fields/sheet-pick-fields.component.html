@if (fields().length > 0) {
  <fr-grid [columns]="3">
    @for (pick of fields(); track pick.key) {
      <fr-stack gap="2xs">
        <fr-inline-field [label]="pick.label.key | transloco: pick.label.params" [edit]="pick.field">
          <fr-select
            frInlineEditor
            [ariaLabel]="pick.label.key | transloco: pick.label.params"
            [options]="pick.options()"
            [value]="pick.field.draft()"
            (valueChange)="pick.field.change($event)"
            (committed)="pick.field.flushSoon()"
            (cancelled)="pick.field.cancel()"
          />
        </fr-inline-field>
        @for (note of pick.trained(); track note.id) {
          <fr-text variant="caption" tone="subtle">{{
            'character.sheet.skillTrainedFrom'
              | transloco: { skill: note.skill, source: note.source.key | transloco: note.source.params }
          }}</fr-text>
        }
      </fr-stack>
    }
  </fr-grid>
}
