<fr-stack gap="lg">
  <pio-sheet-section-tabs [sections]="sectionOrder" />

  <fr-section
    [concealed]="shown()?.anchor !== sections.rest.anchor"
    [anchor]="sections.rest.anchor"
    [heading]="sections.rest.headingKey | transloco"
  >
    <pio-sheet-rest />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.actions.anchor"
    [anchor]="sections.actions.anchor"
    [heading]="sections.actions.headingKey | transloco"
  >
    <pio-sheet-actions [mode]="Mode" />
  </fr-section>

  <fr-section
    [concealed]="shown()?.anchor !== sections.downtime.anchor"
    [anchor]="sections.downtime.anchor"
    [heading]="sections.downtime.headingKey | transloco"
  >
    <pio-shop />
  </fr-section>
</fr-stack>
