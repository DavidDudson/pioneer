<fr-page width="full">
  <fr-page-header [title]="title()" />
  <fr-page-body>
    <fr-stack gap="lg">
      <fr-tabs centered appearance="segment" [label]="'character.sheet.tabs.label' | transloco">
        @for (tab of tabs; track tab.mode) {
          <fr-tab [to]="tab.mode">{{ tab.labelKey | transloco }}</fr-tab>
        }
      </fr-tabs>
      <fr-stack horizontalFrom="lg" gap="lg" align="start">
        <pio-sheet-panels />
        <fr-stack gap="lg" grow>
          <fr-stack gap="sm">
            <fr-stack direction="horizontal" justify="end" align="center" gap="sm" wrap>
              <pio-sheet-header-actions />
            </fr-stack>
            <fr-grid minItem="md" gap="sm">
              <pio-sheet-character-block />
              <pio-sheet-hit-points />
              <pio-sheet-armor-class />
            </fr-grid>
            <pio-sheet-form />
            <pio-sheet-form-picker />
            <pio-sheet-death-track />
            <pio-sheet-resources pool="focus-points" />
            <pio-sheet-counted />
            <pio-sheet-last-roll />
            <fr-async-region>
              <ng-template frAsyncPending><pio-vitals [vitals]="undefined" /></ng-template>
              <ng-template [frAsyncData]="sheet.engineQuery()">
                <pio-vitals
                  [vitals]="sheet.vitals()"
                  [entryNames]="sheet.picks.entryNames()"
                  [originNames]="sheet.originNames()"
                />
              </ng-template>
            </fr-async-region>
          </fr-stack>

          <router-outlet />
        </fr-stack>
      </fr-stack>

      @if (character(); as character) {
        <fr-text element="p" variant="caption" tone="subtle">
          {{ 'character.sheet.created' | transloco }}
          <fr-date format="datetime" [value]="character.createdAt" />
          {{ 'character.sheet.updated' | transloco }}
          <fr-date format="relative" [value]="character.updatedAt" />
          {{ 'character.sheet.version' | transloco: { version: character.version } }}
        </fr-text>
      } @else {
        <fr-skeleton width="lg" />
      }
    </fr-stack>
  </fr-page-body>
  <pio-sheet-drawers ngProjectAs="fr-drawer" />
</fr-page>
<pio-sheet-side-panel />
