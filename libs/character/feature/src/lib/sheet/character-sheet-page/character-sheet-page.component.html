<fr-page [title]="title()">
  <fr-stack gap="lg">
    <fr-surface>
      <fr-stack gap="md">
        <fr-heading variant="subheading" [level]="2">Identity</fr-heading>
        <fr-grid [columns]="3">
          <fr-inline-field label="Name" [edit]="name">
            <fr-text-input
              frInlineEditor
              ariaLabel="Name"
              [value]="name.draft()"
              (valueChange)="name.change($event)"
              (committed)="name.flushSoon()"
              (cancelled)="name.cancel()"
            />
          </fr-inline-field>
          <fr-inline-field label="Ancestry" [edit]="ancestry">
            <fr-select
              frInlineEditor
              ariaLabel="Ancestry"
              [options]="ancestries.options()"
              [value]="ancestry.draft()"
              (valueChange)="ancestry.change($event)"
              (committed)="ancestry.flushSoon()"
              (cancelled)="ancestry.cancel()"
            />
          </fr-inline-field>
          <fr-inline-field label="Level" [edit]="level">
            <fr-number-input
              frInlineEditor
              ariaLabel="Level"
              [min]="levelMin"
              [max]="levelMax"
              [value]="level.draft()"
              (valueChange)="level.change($event)"
              (committed)="level.flushSoon()"
              (cancelled)="level.cancel()"
            />
          </fr-inline-field>
        </fr-grid>
      </fr-stack>
    </fr-surface>

    <fr-surface>
      <fr-stack gap="md">
        <fr-heading variant="subheading" [level]="2">Attributes</fr-heading>
        <fr-grid [columns]="6">
          @for (item of attributes; track item.attribute) {
            <fr-inline-field [label]="item.label" [edit]="item.edit">
              <fr-number-input
                frInlineEditor
                [ariaLabel]="item.label"
                [min]="modifierMin"
                [max]="modifierMax"
                [value]="item.edit.draft()"
                (valueChange)="item.edit.change($event)"
                (committed)="item.edit.flushSoon()"
                (cancelled)="item.edit.cancel()"
              />
            </fr-inline-field>
          }
        </fr-grid>
      </fr-stack>
    </fr-surface>

    @if (character(); as character) {
      <fr-text element="p" variant="caption" tone="subtle">
        Created <fr-date format="datetime" [value]="character.createdAt" /> · updated
        <fr-date format="relative" [value]="character.updatedAt" /> · version {{ character.version }}
      </fr-text>
    } @else {
      <fr-skeleton width="lg" />
    }
  </fr-stack>
</fr-page>
