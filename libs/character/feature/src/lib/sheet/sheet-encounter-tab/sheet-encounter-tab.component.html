<fr-stack horizontalFrom="lg" gap="lg" align="start">
  <fr-rail [label]="sections.skills.headingKey | transloco">
    <pio-sheet-resources pool="hero-points" />
    <fr-section [anchor]="sections.skills.anchor" [heading]="sections.skills.headingKey | transloco">
      <fr-async-region>
        <ng-template frAsyncPending><pio-skills [statistics]="undefined" /></ng-template>
        <ng-template [frAsyncData]="sheet.engineQuery()"
          ><pio-skills
            [statistics]="picks.skills()"
            [entryNames]="picks.entryNames()"
            [originNames]="sheet.originNames()"
        /></ng-template>
      </fr-async-region>
    </fr-section>
  </fr-rail>

  <fr-stack gap="lg" grow>
    <pio-sheet-turn-panel />
    <pio-sheet-spend-log />

    <pio-sheet-section-tabs [sections]="sectionOrder" />

    <fr-section
      [concealed]="shown()?.anchor !== sections.defences.anchor"
      [anchor]="sections.defences.anchor"
      [heading]="sections.defences.headingKey | transloco"
    >
      <fr-async-region>
        <ng-template frAsyncPending><pio-defences [defences]="undefined" /></ng-template>
        <ng-template [frAsyncData]="sheet.registry"
          ><pio-defences
            [defences]="picks.defences()"
            [entryNames]="picks.entryNames()"
            [originNames]="sheet.originNames()"
        /></ng-template>
      </fr-async-region>
    </fr-section>

    <fr-section
      [concealed]="shown()?.anchor !== sections.senses.anchor"
      [anchor]="sections.senses.anchor"
      [heading]="sections.senses.headingKey | transloco"
    >
      <fr-async-region>
        <ng-template frAsyncPending><pio-senses [senses]="undefined" /></ng-template>
        <ng-template [frAsyncData]="sheet.engineQuery()"
          ><pio-senses
            [senses]="picks.senses()?.senses"
            [own]="picks.senses()?.own ?? []"
            [entryNames]="picks.entryNames()"
        /></ng-template>
      </fr-async-region>
    </fr-section>

    <fr-section
      [concealed]="shown()?.anchor !== sections.strikes.anchor"
      [anchor]="sections.strikes.anchor"
      [heading]="sections.strikes.headingKey | transloco"
    >
      <fr-async-region>
        <ng-template frAsyncPending><pio-strikes [strikes]="undefined" /></ng-template>
        <ng-template [frAsyncData]="sheet.engineQuery()"
          ><pio-strikes
            [strikes]="strikes()"
            [attacksMade]="attacksMade()"
            [shields]="picks.shields()"
            [suppressed]="picks.suppressedStrikes()"
            [entryNames]="picks.entryNames()"
            [originNames]="sheet.originNames()"
        /></ng-template>
      </fr-async-region>
      <pio-sheet-shields />
      <pio-sheet-consumables />
    </fr-section>

    <fr-section
      [concealed]="shown()?.anchor !== sections.actions.anchor"
      [anchor]="sections.actions.anchor"
      [heading]="sections.actions.headingKey | transloco"
    >
      <pio-sheet-actions [mode]="Mode" />
    </fr-section>

    <fr-section
      [concealed]="shown()?.anchor !== sections.spellcasting.anchor"
      [anchor]="sections.spellcasting.anchor"
      [heading]="sections.spellcasting.headingKey | transloco"
    >
      <fr-async-region>
        <ng-template frAsyncPending><pio-spellcasting [entries]="undefined" /></ng-template>
        <ng-template [frAsyncData]="sheet.registry"
          ><pio-spellcasting
            [entries]="picks.spellcasting()"
            [entryNames]="picks.entryNames()"
            [originNames]="sheet.originNames()"
        /></ng-template>
      </fr-async-region>
      <pio-sheet-spells [casts]="casts()" [focuses]="focuses()" />
      <pio-sheet-cast-items />
    </fr-section>
  </fr-stack>
</fr-stack>
