<fr-stack gap="xs">
  <pio-triggered-prompt [lines]="offered()" [entryNames]="entryNames()" (passed)="pass()" />
  <fr-async-region>
    <ng-template frAsyncPending><pio-actions [lines]="undefined" /></ng-template>
    <ng-template [frAsyncData]="registry">
      <fr-async-region>
        <ng-template frAsyncPending><pio-actions [lines]="undefined" /></ng-template>
        <ng-template [frAsyncData]="playQuery">
          <pio-actions
            [lines]="lines()"
            [mode]="mode()"
            [entryNames]="entryNames()"
            [category]="kind()"
            [(view)]="view"
            (categoryChange)="open($event)"
          />
        </ng-template>
      </fr-async-region>
    </ng-template>
  </fr-async-region>
  <pio-sheet-consumable-roll />
</fr-stack>
