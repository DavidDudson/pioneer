  <ng-template [frAsyncData]="registry">
    <fr-async-region>
      <ng-template frAsyncPending><pio-actions [lines]="undefined" /></ng-template>
      <ng-template [frAsyncData]="playQuery">
        <pio-actions [lines]="lines()" [mode]="mode()" [entryNames]="entryNames()" [(view)]="view" />

    </fr-async-region>
  </ng-template>
</fr-async-region>
