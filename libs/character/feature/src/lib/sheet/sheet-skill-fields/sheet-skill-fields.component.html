@if (fields().length > 0) {
  <fr-grid [columns]="3">
    @for (skill of fields(); track skill.key) {
      <fr-inline-field [label]="skill.label.key | transloco: skill.label.params" [edit]="skill.field">
        <fr-select
          frInlineEditor
          [ariaLabel]="skill.label.key | transloco: skill.label.params"
          [options]="skill.options()"
          [value]="skill.field.draft()"
          (valueChange)="skill.field.change($event)"
          (committed)="skill.field.flushSoon()"
          (cancelled)="skill.field.cancel()"
        />
      </fr-inline-field>
    }
  </fr-grid>
}
