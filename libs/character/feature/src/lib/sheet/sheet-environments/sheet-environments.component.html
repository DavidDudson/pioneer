<fr-async-region>
  <ng-template frAsyncPending><fr-skeleton width="md" /></ng-template>
  <ng-template [frAsyncData]="playQuery">
    <fr-stack gap="sm">
      <fr-text>{{ 'character.sheet.environments.hint' | transloco }}</fr-text>
      @for (option of options(); track option.id) {
        <fr-toggle-button [value]="active().has(option.id)" (valueChange)="set(option.id, $event)">{{
          option.name
        }}</fr-toggle-button>
      } @empty {
        <fr-text>{{ 'character.sheet.environments.none' | transloco }}</fr-text>
      }
      @for (restriction of restrictions(); track restriction.environment + restriction.id) {
        <fr-text>{{ restriction.reason }}</fr-text>
      }
    </fr-stack>
  </ng-template>
</fr-async-region>
