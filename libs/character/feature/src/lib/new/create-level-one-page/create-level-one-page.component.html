<fr-page>
  <fr-page-header
    [title]="'character.create.levelOne.title' | transloco"
    [description]="'character.create.levelOne.description' | transloco"
  />
  <fr-page-body>
    <fr-stack gap="md">
      <fr-surface>
        <pio-sheet-level-plan [level]="level" />
      </fr-surface>
      <fr-text tone="muted">{{ 'character.create.levelOne.hint' | transloco }}</fr-text>
      <fr-link [to]="['../..', id()]">{{ 'character.create.levelOne.finish' | transloco }}</fr-link>
    </fr-stack>
  </fr-page-body>
</fr-page>
