<fr-page>
  <fr-page-header
    [title]="'character.import.hub.title' | transloco"
    [description]="'character.import.hub.description' | transloco"
  />
  <fr-page-body>
    <fr-stack gap="xl">
      <fr-grid [columns]="2">
        @for (source of sources; track source.path) {
          <fr-surface>
            <fr-stack gap="2xs">
              <fr-link appearance="button" [to]="[source.path]">{{ source.title | transloco }}</fr-link>
              <fr-text tone="muted">{{ source.description | transloco }}</fr-text>
            </fr-stack>
          </fr-surface>
        }
      </fr-grid>
      <fr-link [to]="['..']">{{ 'character.import.hub.back' | transloco }}</fr-link>
    </fr-stack>
  </fr-page-body>
</fr-page>
