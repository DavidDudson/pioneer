@if (anyGaps()) {
  <fr-disclosure>
    <fr-text frDisclosureSummary>{{
      'character.import.result.skillGapsSummary' | transloco: { count: gaps().length }
    }}</fr-text>
    <fr-list>
      @for (row of gaps(); track $index) {
        <fr-list-item>
          <fr-stack direction="horizontal" justify="between" align="center" gap="sm">
            <fr-text>{{ row.name }}</fr-text>
            <fr-text>{{
              'character.import.result.skillGap'
                | transloco: { wanted: (row.wantedKey | transloco), reached: (row.reachedKey | transloco) }
            }}</fr-text>
          </fr-stack>
        </fr-list-item>
      }
    </fr-list>
  </fr-disclosure>
}
