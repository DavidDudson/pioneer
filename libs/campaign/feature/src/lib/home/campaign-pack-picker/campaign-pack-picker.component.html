<fr-stack gap="sm">
  <fr-heading variant="label" [level]="3">{{ 'campaign.packs.enableHeading' | transloco }}</fr-heading>
  @if (candidates().length === 0) {
    <fr-empty-state [icon]="emptyIcon" [title]="'campaign.packs.noneToEnable' | transloco">
      <fr-link [to]="['/homebrew']">{{ 'campaign.packs.toHomebrew' | transloco }}</fr-link>
    </fr-empty-state>
  }
  @if (showForm()) {
    <fr-async-form [form]="form" [action]="enable" [describeError]="describeEnableError">
      <fr-stack gap="sm">
        <fr-picker-field
          [label]="'campaign.packs.packLabel' | transloco"
          [rows]="table.rows.shown()"
          [columns]="table.columns()"
          [rowValue]="table.value"
          [rowLabel]="table.label"
          [formField]="form.packId"
          (searched)="table.rows.query.set($event)"
          (sorted)="table.rows.ordering.set($event)"
        />
        <fr-stack direction="horizontal" justify="start">
          <fr-async-button
            type="submit"
            variant="primary"
            [pendingLabel]="'campaign.packs.enabling' | transloco"
            [successLabel]="'campaign.packs.enabled' | transloco"
          >
            {{ 'campaign.packs.enable' | transloco }}
          </fr-async-button>
        </fr-stack>
      </fr-stack>
    </fr-async-form>
  }
</fr-stack>
