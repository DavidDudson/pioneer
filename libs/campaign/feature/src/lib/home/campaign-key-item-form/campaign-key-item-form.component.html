<fr-stack gap="sm">
  <fr-heading variant="label" [level]="3">{{ 'campaign.keyItems.form.heading' | transloco }}</fr-heading>
  <fr-async-form [form]="form" [action]="create" [describeError]="describeError">
    <fr-stack gap="sm">
      <fr-text-field [label]="'campaign.keyItems.form.name' | transloco" [formField]="form.name" />
      <fr-combobox-field
        [label]="'campaign.keyItems.form.base' | transloco"
        [placeholder]="'campaign.keyItems.form.basePlaceholder' | transloco"
        [options]="baseOptions()"
        [loading]="loading()"
        [formField]="form.base"
        (searched)="find($event)"
      />
      <fr-select-field
        [label]="'campaign.keyItems.form.potency' | transloco"
        [options]="gradeOptions()"
        [formField]="form.potency"
      />
      <fr-select-field
        [label]="'campaign.keyItems.form.striking' | transloco"
        [options]="gradeOptions()"
        [formField]="form.striking"
      />
      <fr-select-field
        [label]="'campaign.keyItems.form.resilient' | transloco"
        [options]="gradeOptions()"
        [formField]="form.resilient"
      />
      <fr-select-field
        [label]="'campaign.keyItems.form.reinforcing' | transloco"
        [options]="reinforcingOptions()"
        [formField]="form.reinforcing"
      />
      <pio-campaign-key-item-runes [(runes)]="property" />
      <fr-text-area-field [label]="'campaign.keyItems.form.notes' | transloco" [rows]="3" [formField]="form.notes" />
      <fr-stack direction="horizontal" justify="start">
        <fr-async-button
          type="submit"
          variant="primary"
          [pendingLabel]="'campaign.keyItems.form.creating' | transloco"
          [successLabel]="'campaign.keyItems.form.created' | transloco"
        >
          {{ 'campaign.keyItems.form.create' | transloco }}
        </fr-async-button>
      </fr-stack>
    </fr-stack>
  </fr-async-form>
</fr-stack>
