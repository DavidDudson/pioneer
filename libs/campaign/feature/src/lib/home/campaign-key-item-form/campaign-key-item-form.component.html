<fr-stack gap="sm">
  <fr-heading variant="label" [level]="3">{{ 'campaign.keyItems.form.heading' | transloco }}</fr-heading>
  <fr-async-form [form]="form" [action]="create" [describeError]="describeError">
    <fr-stack gap="sm">
      <fr-text-field [label]="'campaign.keyItems.form.name' | transloco" [formField]="form.name" />
      <fr-picker-field
        [label]="'campaign.keyItems.form.base' | transloco"
        [placeholder]="'campaign.keyItems.form.basePlaceholder' | transloco"
        [rows]="baseOptions()"
        [columns]="baseColumns()"
        [rowValue]="baseValue"
        [rowLabel]="baseLabel"
        [loading]="loading()"
        [formField]="form.base"
        (searched)="find($event)"
      />
      <fr-picker-field
        [label]="'campaign.keyItems.form.potency' | transloco"
        [rows]="potency.rows.shown()"
        [columns]="potency.columns()"
        [rowValue]="potency.value"
        [rowLabel]="potency.label"
        [formField]="form.potency"
        (searched)="potency.rows.query.set($event)"
        (sorted)="potency.rows.ordering.set($event)"
      />
      <fr-picker-field
        [label]="'campaign.keyItems.form.striking' | transloco"
        [rows]="striking.rows.shown()"
        [columns]="striking.columns()"
        [rowValue]="striking.value"
        [rowLabel]="striking.label"
        [formField]="form.striking"
        (searched)="striking.rows.query.set($event)"
        (sorted)="striking.rows.ordering.set($event)"
      />
      <fr-picker-field
        [label]="'campaign.keyItems.form.resilient' | transloco"
        [rows]="resilient.rows.shown()"
        [columns]="resilient.columns()"
        [rowValue]="resilient.value"
        [rowLabel]="resilient.label"
        [formField]="form.resilient"
        (searched)="resilient.rows.query.set($event)"
        (sorted)="resilient.rows.ordering.set($event)"
      />
      <fr-picker-field
        [label]="'campaign.keyItems.form.reinforcing' | transloco"
        [rows]="reinforcing.rows.shown()"
        [columns]="reinforcing.columns()"
        [rowValue]="reinforcing.value"
        [rowLabel]="reinforcing.label"
        [formField]="form.reinforcing"
        (searched)="reinforcing.rows.query.set($event)"
        (sorted)="reinforcing.rows.ordering.set($event)"
      />
      <pio-campaign-key-item-runes [(runes)]="property" />
      <fr-text-area-field [label]="'campaign.keyItems.form.notes' | transloco" [rows]="3" [formField]="form.notes" />
      <fr-stack direction="horizontal" justify="start">
        <fr-async-button
          type="submit"
          variant="primary"
          [pendingLabel]="'campaign.keyItems.form.creating' | transloco"
          [successLabel]="'campaign.keyItems.form.created' | transloco"
        >
          {{ 'campaign.keyItems.form.create' | transloco }}
        </fr-async-button>
      </fr-stack>
    </fr-stack>
  </fr-async-form>
</fr-stack>
