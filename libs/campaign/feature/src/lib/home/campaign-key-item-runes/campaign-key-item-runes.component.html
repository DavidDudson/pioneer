<fr-stack gap="sm">
  <fr-heading variant="label" [level]="4">{{ 'campaign.keyItems.form.propertyRunes' | transloco }}</fr-heading>
  <fr-picker
    [ariaLabel]="'campaign.keyItems.form.propertyRunes' | transloco"
    [placeholder]="'campaign.keyItems.form.runePlaceholder' | transloco"
    [rows]="options()"
    [columns]="columns()"
    [rowValue]="rowValue"
    [rowLabel]="rowLabel"
    [loading]="loading()"
    [(value)]="picked"
    (searched)="find($event)"
  />
  <fr-list gap="xs">
    @for (rune of runes(); track rune.rune) {
      <fr-list-item>
        <fr-stack direction="horizontal" gap="sm" align="center">
          <fr-stack grow
            ><fr-text>{{ rune.name }}</fr-text></fr-stack
          >
          <fr-button
            size="sm"
            variant="ghost"
            [ariaLabel]="'campaign.keyItems.form.removeRune' | transloco: { name: rune.name }"
            (pressed)="remove(rune.rune)"
            >{{ 'campaign.keyItems.form.remove' | transloco }}</fr-button
          >
        </fr-stack>
      </fr-list-item>
    }
  </fr-list>
</fr-stack>
