<fr-stack gap="sm" align="start">
  <fr-text element="p">{{ text().confirm | transloco: { name: name() } }}</fr-text>
  <fr-stack direction="horizontal" gap="sm" wrap>
    <fr-async-button
      variant="danger"
      [action]="action()"
      [describeError]="describeError()"
      [pendingLabel]="text().pending | transloco"
      [successLabel]="text().success | transloco"
      >{{ text().action | transloco }}</fr-async-button
    >
    @if (!settled()) {
      <fr-button variant="ghost" (pressed)="cancelled.emit()">{{ 'campaign.members.cancel' | transloco }}</fr-button>
    }
  </fr-stack>
</fr-stack>
