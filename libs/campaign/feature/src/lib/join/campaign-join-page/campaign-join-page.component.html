<fr-page>
  <fr-page-header [title]="'campaign.join.title' | transloco" />
  <fr-page-body>
    <fr-surface>
      @if (parsed === undefined || joining.isError()) {
        <fr-stack gap="md">
          <fr-message>{{ joining.errorMessage() ?? ('campaign.join.unknownInvite' | transloco) }}</fr-message>
          <fr-link exact [to]="['/campaigns']">{{ 'campaign.join.toCampaigns' | transloco }}</fr-link>
        </fr-stack>
      } @else {
        <fr-text tone="muted" role="status">{{ 'campaign.join.joining' | transloco }}</fr-text>
      }
    </fr-surface>
  </fr-page-body>
</fr-page>
