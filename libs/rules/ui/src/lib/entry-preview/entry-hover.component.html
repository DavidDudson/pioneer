<ng-template #body><ng-content /></ng-template>

@if (preview()) {
  <fr-hover-card (opened)="load()">
    <ng-container *ngTemplateOutlet="body" />
    <ng-template frHoverCardContent>
      <ng-container *ngComponentOutlet="card() ?? null; inputs: inputs()" />
    </ng-template>
  </fr-hover-card>
} @else {
  <ng-container *ngTemplateOutlet="body" />
}
