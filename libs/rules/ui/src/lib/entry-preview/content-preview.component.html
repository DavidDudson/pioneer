<ng-template #body><ng-content /></ng-template>

@if (previewable()) {
  <fr-hover-card (opened)="load()">
    <ng-container *ngTemplateOutlet="body" />
    <ng-template frHoverCardContent>
      <fr-stack gap="xs">
        @if (phase() === Phase.Ready) {
          <ng-container *ngComponentOutlet="card() ?? null; inputs: inputs()" />
          @if (link(); as link) {
            <fr-link [to]="link.to">{{ Message.Open | transloco: { name: link.name } }}</fr-link>
          }
        } @else if (notice(); as notice) {
          <fr-text [tone]="notice.tone">{{ notice.message | transloco }}</fr-text>
        } @else {
          @for (line of lines; track line) {
            <fr-skeleton width="lg" />
          }
        }
      </fr-stack>
    </ng-template>
  </fr-hover-card>
} @else {
  <ng-container *ngTemplateOutlet="body" />
}
