<fr-stack gap="xs">
  <fr-text weight="medium">{{ Message.Endings | transloco }}</fr-text>
  @for (row of rows(); track $index) {
    @let ending = row.ending;
    <fr-stack gap="3xs">
      <fr-stack gap="2xs" direction="horizontal" align="center">
        <fr-text variant="caption" weight="medium">{{ KindMessage[ending.kind] | transloco }}</fr-text>
        @for (badge of row.badges; track badge) {
          <fr-badge>{{ badge }}</fr-badge>
        }
      </fr-stack>
      <pio-rich-text [text]="ending.text" />
      @if (ending.action; as action) {
        <fr-text variant="caption"
          >{{ Message.EndingAction | transloco }}
          <pio-content-preview [entry]="action.id">{{ action.name }}</pio-content-preview></fr-text
        >
      }
    </fr-stack>
  }
</fr-stack>
