<fr-stack gap="xs">
  <fr-heading [level]="headingLevel">{{ preview().name }}</fr-heading>
  @if (preview().level; as level) {
    <fr-text element="p" variant="caption" tone="muted">{{ Message.Level | transloco: { level } }}</fr-text>
  }
  @if (preview().traits.length > 0) {
    <fr-stack gap="2xs" direction="horizontal" wrap>
      @for (trait of preview().traits; track trait) {
        <fr-badge>{{ trait }}</fr-badge>
      }
    </fr-stack>
  }
  <pio-rich-text [text]="summary()" [headingLevel]="headingLevel" />
  <pio-source-line [sources]="preview().sources" />
</fr-stack>
