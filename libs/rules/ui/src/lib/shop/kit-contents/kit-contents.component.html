<fr-list gap="3xs" markers>
  @for (line of lines(); track $index) {
    <fr-list-item>
      <pio-entry-hover [entry]="line.item">
        <fr-text tabindex="0">{{ text(line) }}</fr-text>
      </pio-entry-hover>
      @if (line.contents.length > 0) {
        <fr-list gap="3xs" markers>
          @for (inside of line.contents; track $index) {
            <fr-list-item>
              <pio-entry-hover [entry]="inside.item">
                <fr-text tabindex="0">{{ text(inside) }}</fr-text>
              </pio-entry-hover>
            </fr-list-item>
          }
        </fr-list>
      }
    </fr-list-item>
  }
</fr-list>
