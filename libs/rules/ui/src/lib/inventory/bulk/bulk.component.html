<fr-stack gap="xs">
  @if (shown(); as shown) {
    <fr-meter
      [label]="Message.Meter | transloco"
      [value]="shown.whole"
      [max]="shown.maximum"
      [low]="shown.encumberedAfter"
      [high]="shown.maximum"
      [optimum]="best"
    />
    <fr-stack direction="horizontal" gap="xs" align="center" wrap>
      <fr-text variant="caption">{{ Message.Carried | transloco: shown.carried }}</fr-text>
      @if (shown.badge; as badge) {
        <fr-badge [tone]="badge.tone">{{ badge.message | transloco }}</fr-badge>
      }
    </fr-stack>
    <fr-text variant="caption" tone="subtle">{{ Message.Limits | transloco: shown.limits }}</fr-text>
  } @else {
    <fr-skeleton width="md" />
  }
</fr-stack>
