<fr-stack gap="3xs">
  @if (derived(); as attack) {
    <fr-disclosure>
      <fr-text frDisclosureSummary
        >{{ row().name }} <pio-statistic-total [total]="attack.total" [computed]="attack.computed"
      /></fr-text>
      <fr-stack gap="xs">
        <fr-text variant="caption" tone="muted">{{ Message.AttackHeading | transloco }}</fr-text>
        <pio-breakdown
          [statistic]="attack.statistic"
          [kind]="attackKind"
          [entryNames]="entryNames()"
          [originNames]="originNames()"
        />
        @if (row().bonus; as bonus) {
          <fr-text variant="caption" tone="muted">{{ Message.DamageHeading | transloco }}</fr-text>
          <pio-breakdown
            [statistic]="bonus"
            [kind]="bonusKind"
            [entryNames]="entryNames()"
            [originNames]="originNames()"
          />
        }
      </fr-stack>
    </fr-disclosure>
  } @else {
    <fr-stack direction="horizontal" gap="xs" align="center" wrap>
      <fr-text>{{ row().name }}</fr-text>
      <fr-badge tone="danger">{{ Statistics.Failed | transloco }}</fr-badge>
    </fr-stack>
    <fr-text variant="caption" tone="muted">{{ failure() }}</fr-text>
  }
  <fr-text>{{ row().damage }}</fr-text>
  <fr-text variant="caption" tone="muted">{{ row().penalty }}</fr-text>
</fr-stack>
