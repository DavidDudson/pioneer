@if (shown(); as strikes) {
  @if (strikes.length === 0) {
    <fr-empty-state
      ><fr-empty-state-title>{{ Statistics.NoStrikes | transloco }}</fr-empty-state-title></fr-empty-state
    >
  } @else {
    <fr-list gap="3xs">
      @for (row of strikes; track row.key) {
        <fr-list-item
          ><pio-strike-row [row]="row" [entryNames]="entryNames()" [originNames]="originNames()"
        /></fr-list-item>
      }
    </fr-list>
  }
  @for (caption of captions(); track caption) {
    <fr-text variant="caption" tone="muted">{{ caption }}</fr-text>
  }
} @else {
  <fr-list gap="3xs">
    @for (row of loadingRows; track row) {
      <fr-list-item><fr-skeleton width="md" /></fr-list-item>
    }
  </fr-list>
}
