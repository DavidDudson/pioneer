<fr-stack gap="md">
  @if (lists(); as lists) {
    @for (list of lists; track list.heading) {
      <pio-defence-list [list]="list" />
    }
  } @else {
    @for (list of loadingLists; track list) {
      <fr-stack gap="xs">
        <fr-skeleton width="sm" />
        <fr-skeleton width="lg" />
      </fr-stack>
    }
  }
</fr-stack>
