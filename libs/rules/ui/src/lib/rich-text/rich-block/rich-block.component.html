@let leaf = block();
@switch (leaf.type) {
  @case ('table') {
    @defer {
      <pio-rich-table [table]="leaf" />
    } @placeholder {
      <fr-skeleton shape="block" />
    }
  }
  @case ('rule') {
    <fr-divider />
  }
  @default {
    <pio-rich-prose [block]="leaf" [headingLevel]="headingLevel()" />
  }
}
