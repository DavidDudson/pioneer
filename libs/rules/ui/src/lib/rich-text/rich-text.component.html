<fr-stack gap="sm">
  @for (block of text(); track $index) {
    @if (block.type === 'list') {
      <fr-list markers [ordered]="block.ordered">
        @for (item of block.items; track $index) {
          <fr-list-item><pio-rich-text [text]="item" /></fr-list-item>
        }
      </fr-list>
    } @else {
      <pio-rich-block [block]="block" />
    }
  }
</fr-stack>
