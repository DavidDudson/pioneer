@if (rows(); as spells) {
  @if (spells.length === 0) {
    <fr-empty-state [title]="Message.None | transloco" />
  } @else {
    <fr-list gap="xs">
      @for (spell of spells; track spell.spell) {
        <fr-list-item>
          <fr-stack direction="horizontal" justify="between" align="center" gap="sm">
            <pio-content-preview [entry]="spell.spell">
              <fr-text tabindex="0">{{ spell.name }}</fr-text>
            </pio-content-preview>
            <fr-async-button
              variant="ghost"
              iconOnly
              [ariaLabel]="Message.Remove | transloco: { name: spell.name }"
              [action]="spell.remove"
              ><fr-icon [icon]="RemoveIcon"
            /></fr-async-button>
          </fr-stack>
        </fr-list-item>
      }
    </fr-list>
  }
} @else {
  <fr-list gap="xs">
    @for (row of loadingRows; track row) {
      <fr-list-item><fr-skeleton width="md" /></fr-list-item>
    }
  </fr-list>
}
