@let breakdown = shown();
<fr-stack gap="xs">
  @if (breakdown.pinned; as pinned) {
    <fr-text>{{ pinned }}</fr-text>
  }
  @if (breakdown.form; as form) {
    <fr-text>{{ form }}</fr-text>
  }
  <fr-text variant="caption" tone="muted">{{ breakdown.base }}</fr-text>
  <pio-base-terms [terms]="breakdown.terms" />
  <fr-text variant="caption" tone="muted">{{ Message.Modifiers | transloco }}</fr-text>
  @if (breakdown.lines.length === 0) {
    <fr-text tone="muted">{{ Message.NoModifiers | transloco }}</fr-text>
  } @else {
    <pio-breakdown-lines [lines]="breakdown.lines" [entryNames]="entryNames()" [names]="originNames()" />
  }
  <pio-override-lines [lines]="breakdown.overrides" [entryNames]="entryNames()" [names]="originNames()" />
</fr-stack>
