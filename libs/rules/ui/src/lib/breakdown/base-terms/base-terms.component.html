<fr-list gap="3xs" markers>
  @for (term of terms(); track $index) {
    <fr-list-item>
      <fr-stack direction="horizontal" gap="xs" align="center" wrap>
        @if (term.code; as code) {
          <fr-text element="code">{{ code }}</fr-text>
        } @else {
          <fr-text tone="muted">{{ Rounding | transloco }}</fr-text>
        }
        <fr-text>{{ term.value }}</fr-text>
        @if (term.variant; as variant) {
          <fr-text tone="muted">{{ variant }}</fr-text>
        }
      </fr-stack>
    </fr-list-item>
  }
</fr-list>
