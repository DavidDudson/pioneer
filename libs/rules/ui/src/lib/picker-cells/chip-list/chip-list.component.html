<fr-stack direction="horizontal" gap="2xs" wrap>
  @for (chip of value(); track chip.label) {
    @if (chip.trait; as trait) {
      <pio-trait-chip [trait]="trait" [label]="chip.label" [tone]="chip.tone ?? 'neutral'" />
    } @else {
      <ng-template #badge><fr-badge [label]="chip.label" [tone]="chip.tone ?? 'neutral'" /></ng-template>
      @if (chip.entry; as entry) {
        <pio-content-preview [entry]="entry">
          <fr-text [attr.tabindex]="previewable(entry) ? 0 : null"><ng-container *ngTemplateOutlet="badge" /></fr-text>
        </pio-content-preview>
      } @else {
        <ng-container *ngTemplateOutlet="badge" />
      }
    }
  }
</fr-stack>
