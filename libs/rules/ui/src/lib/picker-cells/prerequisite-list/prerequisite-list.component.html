@if (prerequisites().length === 0) {
  <fr-text tone="muted">{{ Message.None | transloco }}</fr-text>
} @else {
  <fr-list gap="3xs">
    @for (line of prerequisites(); track line.label) {
      @let view = views[line.state];
      <fr-list-item>
        <fr-stack direction="horizontal" gap="2xs" align="center">
          <fr-icon [icon]="view.icon" [tone]="view.iconTone" />
          <fr-text [tone]="view.textTone"
            ><fr-glyph [label]="view.spoken | transloco: { prerequisite: line.label }">{{
              line.label
            }}</fr-glyph></fr-text
          >
        </fr-stack>
      </fr-list-item>
    }
  </fr-list>
}
