<fr-stack gap="xs">
  <fr-stack direction="horizontal" gap="xs" align="center">
    @if (action().costIcon; as costIcon) {
      <fr-action-icon [cost]="costIcon.cost" [upTo]="costIcon.upTo" [label]="costIcon.label" />
    }
    <fr-text variant="caption" tone="muted">{{ action().detail }}</fr-text>
  </fr-stack>
  @if (badges().length > 0) {
    <pio-chip-list [chips]="badges()" />
  }
  @for (fact of facts(); track fact.label) {
    <fr-stack gap="3xs">
      <fr-text variant="caption" tone="muted">{{ fact.label | transloco }}</fr-text>
      <pio-rich-text [text]="fact.text" [headingLevel]="level" />
    </fr-stack>
  }
  <pio-action-recharge [period]="action().line.recharge" />
  <pio-rich-text [text]="effect()" [headingLevel]="level" />
  <pio-statistic-conditions [conditions]="action().conditions" />
  @for (reason of action().reasons; track reason) {
    <fr-text variant="caption" tone="muted">{{ reason }}</fr-text>
  }
</fr-stack>
