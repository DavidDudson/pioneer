<fr-stack gap="3xs">
  <fr-stack direction="horizontal" gap="xs" align="center" wrap>
    <fr-stack grow>
      <fr-text>{{ action().line.name }}</fr-text>
    </fr-stack>
    @if (showStatus()) {
      <fr-badge [tone]="statusTone()">{{ statusKey() | transloco }}</fr-badge>
    }
    @if (action().line.roll; as roll) {
      <pio-statistic-roll [name]="action().line.name" [kind]="Check" [statistic]="roll" />
    }
  </fr-stack>
  <fr-text variant="caption" tone="muted">{{ action().detail }}</fr-text>
  @if (chips().length > 0) {
    <pio-chip-list [chips]="chips()" />
  }
  @for (reason of action().reasons; track reason) {
    <fr-text variant="caption" tone="muted">{{ reason }}</fr-text>
  }
</fr-stack>
