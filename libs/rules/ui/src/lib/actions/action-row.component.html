<fr-stack direction="horizontal" gap="xs" align="center">
  <fr-stack direction="horizontal" gap="xs" align="center" grow>
    @if (action().costIcon; as costIcon) {
      <fr-action-icon [cost]="costIcon.cost" [upTo]="costIcon.upTo" [label]="costIcon.label" />
    }
    <pio-entry-name-cell [name]="action().line.name" [entry]="action().line.id" />
  </fr-stack>
  @if (showStatus()) {
    <fr-badge [tone]="statusTone()">{{ statusKey() | transloco }}</fr-badge>
  }
  @if (action().line.roll; as roll) {
    <pio-statistic-roll [name]="action().line.name" [kind]="Check" [statistic]="roll" />
  }
  <pio-use-buttons [line]="action().line" />
</fr-stack>
