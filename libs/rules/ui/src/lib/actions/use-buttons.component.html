@if (usable()) {
  @for (option of payOptions(); track $index) {
    <fr-async-button size="sm" [action]="useWith(option)">
      {{ option.label.key | transloco: option.label.params }}
    </fr-async-button>
  } @empty {
    @for (count of counts(); track count) {
      <fr-async-button size="sm" [action]="useFor(count)">
        {{ useKey(count) | transloco: { count } }}
      </fr-async-button>
    } @empty {
      <fr-async-button size="sm" [action]="useFor(undefined)">{{ Message.Use | transloco }}</fr-async-button>
    }
  }
}
