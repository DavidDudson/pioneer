<fr-stack gap="xs">
  @for (row of rows(); track row.attribute) {
    <fr-stack direction="horizontal" justify="between" align="center" gap="xs">
      <fr-text>{{ row.shortName | transloco }}</fr-text>
      @if (row.statistic; as statistic) {
        <pio-statistic-roll
          [name]="row.name | transloco"
          [kind]="Check"
          [statistic]="statistic"
          [entryNames]="entryNames()"
          [originNames]="originNames()"
        />
      } @else {
        <fr-skeleton width="xs" />
      }
    </fr-stack>
  }
</fr-stack>
