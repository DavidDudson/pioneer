<fr-grid minItem="md" gap="sm">
  @if (blocks(); as shown) {
    @for (block of shown; track block.key) {
      <fr-surface padding="sm">
        @if (block.tile; as tile) {
          <pio-statistics [statistics]="tile.list" [entryNames]="entryNames()" [originNames]="originNames()" />
        } @else {
          <pio-statistics
            skillRows
            [statistics]="block.rows"
            [entryNames]="entryNames()"
            [originNames]="originNames()"
          />
        }
      </fr-surface>
    }
  } @else {
    @for (tile of loadingTiles; track tile) {
      <fr-surface padding="sm"><fr-skeleton width="md" /></fr-surface>
    }
  }
</fr-grid>
