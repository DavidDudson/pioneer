<fr-grid minItem="sm" gap="sm">
  @if (blocks(); as shown) {
    @for (block of shown; track block.key) {
      <fr-surface padding="sm">
        @if (block.tile; as tile) {
          <fr-stack gap="3xs">
            <pio-statistics [statistics]="tile.list" [entryNames]="entryNames()" [originNames]="originNames()" />
            <fr-stack direction="horizontal" gap="xs" align="center" wrap>
              <pio-proficiency-rank [rank]="tile.rank" />
              @if (tile.caption; as caption) {
                <fr-text variant="caption" tone="muted">{{ caption }}</fr-text>
              }
            </fr-stack>
          </fr-stack>
        } @else {
          <pio-statistics
            skillRows
            [statistics]="block.saves"
            [entryNames]="entryNames()"
            [originNames]="originNames()"
          />
        }
      </fr-surface>
    }
  } @else {
    @for (tile of loadingTiles; track tile) {
      <fr-surface padding="sm"><fr-skeleton width="md" /></fr-surface>
    }
  }
</fr-grid>
