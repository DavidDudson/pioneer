@if (overrides) {
  <fr-stack direction="horizontal" gap="xs">
    <fr-link
      [to]="adjustLink().to"
      [queryParams]="adjustLink().queryParams"
      [ariaLabel]="Message.AdjustLabel | transloco: { name: name() }"
      >{{ Message.Adjust | transloco }}</fr-link
    >
    <fr-link
      [to]="setLink().to"
      [queryParams]="setLink().queryParams"
      [ariaLabel]="Message.SetLabel | transloco: { name: name() }"
      >{{ Message.Set | transloco }}</fr-link
    >
  </fr-stack>
}
