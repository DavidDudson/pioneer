<fr-stack direction="horizontal" justify="between" align="center" gap="xs">
  <fr-text>{{ name() }}</fr-text>
  <fr-stack direction="horizontal" gap="xs" align="center">
    <pio-proficiency-badge [rank]="rank()" [sources]="rankSources()" [note]="rankNote()" />
    @if (!rollable()) {
      <fr-hover-card>
        <fr-button [variant]="inline">
          <pio-statistic-total
            [total]="total()"
            [computed]="computed()"
            [adjusted]="adjusted()"
            [fromForm]="fromForm()"
          />
        </fr-button>
        <ng-template frHoverCardContent>
          <pio-breakdown
            [statistic]="statistic()"
            [kind]="kind()"
            [entryNames]="entryNames()"
            [originNames]="originNames()"
          />
        </ng-template>
      </fr-hover-card>
    } @else {
      <pio-statistic-roll
        [name]="name()"
        [kind]="kind()"
        [statistic]="statistic()"
        [entryNames]="entryNames()"
        [originNames]="originNames()"
      />
    }
  </fr-stack>
</fr-stack>
