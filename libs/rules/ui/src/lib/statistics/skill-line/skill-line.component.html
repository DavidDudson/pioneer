<fr-stack direction="horizontal" justify="between" align="center" gap="xs">
  <fr-text>{{ name() }}</fr-text>
  <fr-stack direction="horizontal" gap="xs" align="center">
    <pio-proficiency-badge [rank]="rank()" [sources]="rankSources()" [note]="rankNote()" />
    @if (roller) {
      <pio-statistic-roll
        [name]="name()"
        [kind]="kind()"
        [statistic]="statistic()"
        [entryNames]="entryNames()"
        [originNames]="originNames()"
      />
    } @else {
      <pio-statistic-total [total]="total()" [computed]="computed()" [adjusted]="adjusted()" [fromForm]="fromForm()" />
    }
  </fr-stack>
</fr-stack>
