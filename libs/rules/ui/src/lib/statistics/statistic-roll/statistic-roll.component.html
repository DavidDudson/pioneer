@if (roller && kind() === Check) {
  <fr-hover-card [tapOpens]="false">
    <fr-button
      [variant]="outline"
      [size]="small"
      [ariaLabel]="Message.Roll | transloco: { name: name(), modifier: label() }"
      (pressed)="roll()"
    >
      <fr-text monospace minWidth="modifier">{{ label() }}</fr-text>
    </fr-button>
    <ng-template frHoverCardContent>
      <pio-breakdown
        [statistic]="statistic()"
        [kind]="kind()"
        [entryNames]="entryNames()"
        [originNames]="originNames()"
      />
    </ng-template>
  </fr-hover-card>
}
