@if (rollable()) {
  <fr-hover-card [tapOpens]="false">
    <fr-button
      [variant]="rollVariant"
      [size]="small"
      [rollTone]="cues().tone"
      [rollLuck]="cues().luck"
      [rollShifted]="cues().shifted"
      [ariaLabel]="ariaLabel()"
      (pressed)="roll()"
    >
      <fr-text monospace tone="inherit" minWidth="modifier">{{ shown() }}</fr-text>
    </fr-button>
    <ng-template frHoverCardContent>
      <fr-stack gap="xs">
        <pio-breakdown
          [statistic]="statistic()"
          [kind]="kind()"
          [entryNames]="entryNames()"
          [originNames]="originNames()"
        />
        @for (effect of effects(); track effect) {
          <fr-text>{{ effect }}</fr-text>
        }
      </fr-stack>
    </ng-template>
  </fr-hover-card>
}
