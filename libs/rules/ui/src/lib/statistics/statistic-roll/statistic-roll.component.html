@if (roller && kind() === Check) {
  <fr-stack direction="horizontal" gap="3xs">
    <fr-hover-card [tapOpens]="false">
      <fr-button
        [variant]="outline"
        [size]="small"
        [ariaLabel]="Message.Roll | transloco: { name: name() }"
        (pressed)="roll()"
      >
        {{ label() }}
      </fr-button>
      <ng-template frHoverCardContent>
        <pio-breakdown
          [statistic]="statistic()"
          [kind]="kind()"
          [entryNames]="entryNames()"
          [originNames]="originNames()"
        />
      </ng-template>
    </fr-hover-card>
    @if (roller.setUp) {
      <fr-button
        iconOnly
        [variant]="ghost"
        [size]="small"
        [ariaLabel]="Message.RollWithOptions | transloco: { name: name() }"
        (pressed)="setUp()"
      >
        <fr-icon [icon]="Options" />
      </fr-button>
    }
  </fr-stack>
}
