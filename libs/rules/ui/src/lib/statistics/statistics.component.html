@if (shown(); as statistics) {
  @if (statistics.length === 0) {
    <fr-empty-state [title]="Message.None | transloco" />
  } @else {
    <fr-description-list>
      @for (row of statistics; track row.key) {
        <fr-description-item [term]="row.name">
          @if (row.ok) {
            <fr-disclosure>
              <fr-text frDisclosureSummary numeric>{{ row.total }}</fr-text>
              <pio-breakdown [statistic]="row.statistic" [entryNames]="entryNames()" />
            </fr-disclosure>
          } @else {
            <fr-stack gap="3xs">
              <fr-stack direction="horizontal">
                <fr-badge tone="danger">{{ Message.Failed | transloco }}</fr-badge>
              </fr-stack>
              <fr-text variant="caption" tone="muted">{{ row.error }}</fr-text>
            </fr-stack>
          }
        </fr-description-item>
      }
    </fr-description-list>
  }
} @else {
  <fr-stack gap="xs">
    @for (row of loadingRows; track row) {
      <fr-stack direction="horizontal" gap="md">
        <fr-skeleton width="sm" />
        <fr-skeleton width="sm" />
      </fr-stack>
    }
  </fr-stack>
}
