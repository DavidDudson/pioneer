@if (shown(); as statistics) {
  @if (statistics.length === 0) {
    <fr-empty-state [title]="Message.None | transloco" />
  } @else {
    <fr-list gap="3xs">
      @for (row of statistics; track row.key) {
        <fr-list-item>
          @if (row.ok) {
            <fr-disclosure>
              <fr-text frDisclosureSummary
                >{{ row.name }} <pio-statistic-total [total]="row.total" [computed]="row.computed"
              /></fr-text>
              <pio-breakdown
                [statistic]="row.statistic"
                [kind]="row.kind"
                [entryNames]="entryNames()"
                [originNames]="originNames()"
              />
            </fr-disclosure>
          } @else {
            <fr-stack gap="3xs">
              <fr-stack direction="horizontal" gap="xs" align="center" wrap>
                <fr-text>{{ row.name }}</fr-text>
                <fr-badge tone="danger">{{ Message.Failed | transloco }}</fr-badge>
              </fr-stack>
              <fr-text variant="caption" tone="muted">{{ row.error }}</fr-text>
            </fr-stack>
          }
        </fr-list-item>
      }
    </fr-list>
  }
} @else {
  <fr-list gap="3xs">
    @for (row of loadingRows; track row) {
      <fr-list-item><fr-skeleton width="md" /></fr-list-item>
    }
  </fr-list>
}
