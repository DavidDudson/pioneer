@if (shown(); as statistics) {
  @if (statistics.length === 0) {
    <fr-empty-state [title]="noneKey() | transloco" />
  } @else {
    <fr-list gap="3xs">
      @for (row of statistics; track row.key) {
        <fr-list-item>
          @if (row.ok) {
            <pio-statistic-line
              [name]="row.name"
              [kind]="row.kind"
              [statistic]="row.statistic"
              [total]="row.total"
              [computed]="row.computed"
              [adjusted]="row.adjusted"
              [fromForm]="row.fromForm"
              [rank]="row.rank"
              [rankSources]="row.rankSources"
              [skill]="skillRows()"
              [entryNames]="entryNames()"
              [originNames]="originNames()"
            />
            <pio-statistic-override-links [name]="row.name" [selector]="row.key" />
            <pio-statistic-conditions
              [conditions]="row.conditions"
              [toggles]="row.toggles"
              (toggled)="claim(row.key, $event)"
            />
          } @else {
            <fr-stack gap="3xs">
              <fr-stack direction="horizontal" gap="xs" align="center" wrap>
                <fr-text>{{ row.name }}</fr-text>
                <fr-badge tone="danger">{{ Message.Failed | transloco }}</fr-badge>
              </fr-stack>
              <fr-text variant="caption" tone="muted">{{ row.error }}</fr-text>
            </fr-stack>
          }
        </fr-list-item>
      }
    </fr-list>
  }
} @else {
  <fr-list gap="3xs">
    @for (row of loadingRows; track row) {
      <fr-list-item><fr-skeleton width="md" /></fr-list-item>
    }
  </fr-list>
}
