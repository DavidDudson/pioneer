# Supply-chain policy. See AGENTS.md#supply-chain before changing anything here.

[install]
# Pin exact versions on `bun add`; ranges let a compromised patch release in.
exact = true
# pnpm-style strict node_modules: no phantom (undeclared) imports.
linker = "isolated"
# Refuse versions published in the last 24 hours. Most malicious releases are
# caught and yanked within hours. Bypass per package only with a
# reviewed entry in minimumReleaseAgeExcludes.
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = []
# Never auto-install missing imports at runtime.
auto = "disable"

[install.security]
# Socket pre-install scan: blocks known malware and typosquats before
# anything lands in node_modules. Free mode without a token; `socket login`
# for org policy.
scanner = "@socketsecurity/bun-security-scanner"
