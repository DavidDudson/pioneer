# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: assertive
  poem: false
  in_progress_fortune: false
  # The resolve-coderabbit skill reads these as a hint, never as instructions.
  enable_prompt_for_ai_agents: true
  auto_review:
    # PRs open as drafts and get one CodeRabbit round before leaving draft, so drafts must be reviewed.
    drafts: true
    # Stacked PRs (gh stack) target the layer below, not main.
    base_branches:
      - '.*'
  path_filters:
    - '!bun.lock'
    - '!flake.lock'
    - '!apps/api/migrations/meta/**'
    - '!**/storybook-static/**'
  path_instructions:
    - path: 'apps/api/migrations/**/*.sql'
      instructions: >-
        Migrations are generated by drizzle-kit from the schema. Flag destructive or non-reversible changes, and
        columns that store derived values instead of inputs (ADR-0004).
    - path: 'libs/rules/**'
      instructions: >-
        The rules engine is pure and shared between API and web (ADR-0001): no I/O, clock or randomness.
        Predicates are three-valued (ADR-0002). Every rule carries a source reference (ADR-0005).
    - path: 'libs/*/domain/**'
      instructions: >-
        No bare string or number types: ids and quantities are Zod brands, closed sets are const objects. Build
        brands with Brand.parse, never `as`.
    - path: '**/*.html'
      instructions: >-
        No literal user-facing text; use message keys (ADR-0009). Follow libs/frontier/AGENTS.md for UI rules.
    - path: '**/i18n/en.json'
      instructions: >-
        Keys are spelled out in full and used literally in code; flag keys that look built at runtime.
  # Lint, conventional titles/commits, actionlint and zizmor run in CI (.github/workflows/ci.yml), which is the
  # source of truth. Bundled linters lack the pioneer oxlint plugin and would contradict it.
  tools:
    oxc:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    actionlint:
      enabled: false
    zizmor:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    squawk:
      enabled: true
    shellcheck:
      enabled: true
  finishing_touches:
    # On demand only (checkbox or `@coderabbitai autofix`). Reserve for small nitpicks; verify with the
    # resolve-coderabbit skill first, and prefer the top layer of a stack.
    autofix:
      enabled: true
    simplify:
      enabled: false
    # Tests ship with each vertical slice and docstrings don't match the repo's comment style.
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
    # Team plan only. Off: stacks are rebased and fixed through gh stack, not bot commits or stacked PRs.
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
knowledge_base:
  code_guidelines:
    filePatterns:
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      - 'docs/adr/*.md'
      - 'docs/architecture/*.md'
