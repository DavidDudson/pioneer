version: 1

project-management:
  name: github
  project: DavidDudson/pioneer

# Only the cheap, file-scoped commands. typecheck, test and build are per Nx project and CI runs the full
# set (see CLAUDE.md "Checks"), so they are left unset rather than pointed at `nx affected`.
commands:
  lint: .claude/scripts/run-check.sh bunx oxlint
  format: bun fmt

# One dev stack per workspace. {port} is the web port from the pool; the API sits 1200 below it (4200 -> 3000) and
# Postgres 50129 above it (4200 -> 54329), so all three ports are unique per running workspace and match the
# defaults in flake.nix. start and stop both set PGPORT so db-down hits the database db-up started.
apps:
  - id: web
    label: web
    start: WEB_PORT={port} API_PORT=$(({port} - 1200)) PGPORT=$(({port} + 50129)) .claude/scripts/devshell.sh just dev
    stop: PGPORT=$(({port} + 50129)) .claude/scripts/devshell.sh just db-down
    ports: [4200, 4201, 4202, 4203, 4204, 4205, 4206, 4207]
    ready: { http: 'http://localhost:{port}' }
