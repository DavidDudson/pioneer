name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  # Nx keeps its cache under ~/.nx by default; in the checkout it can be saved and restored with actions/cache.
  NX_CACHE_DIRECTORY: .nx/cache
  # Bounds the cache each job saves; Nx evicts the least recently used entries past it.
  NX_MAX_CACHE_SIZE: 512MB

concurrency:
  # Each push to main gets its own group: a group holds one pending run, so a shared one dropped every queued
  # main run when the next merge landed, and main never finished a run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what the rest needs. The check and test matrices live in .github/ci-jobs.json; this keeps the entries that
  # cover a project the change affects (tools/ci-plan-run.ts), so a docs or content-only push runs lint and little else.
  # A pull request is measured against its base branch, main against its last passing run. Each part of the matrices
  # keeps its reason: the character feature suite is split in parts because one worker's memory grows with every file
  # (the sheet page specs, the heaviest, by name); the api's character generation is split in four by the generate-*
  # configurations, which name the Player Core classes between them (a class added to that test goes in one of them
  # too); the rules-ui stories took over 5 minutes on a cold cache, so they run in three shards. A new project needs
  # no entry: the "rest" entries take every project the others do not name.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      fetch_base: ${{ steps.plan.outputs.fetch_base }}
      check: ${{ steps.plan.outputs.check }}
      test: ${{ steps.plan.outputs.test }}
      run_check: ${{ steps.plan.outputs.run_check }}
      run_test: ${{ steps.plan.outputs.run_test }}
      workflows: ${{ steps.plan.outputs.workflows }}
      infra: ${{ steps.plan.outputs.infra }}
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Plan
        id: plan
        run: bun tools/ci-plan-run.ts
        env:
          GH_TOKEN: ${{ github.token }}

  # `bun run check` split by runtime so each job stays under 5 minutes. The ci:* scripts together cover check;
  # a target added to check goes in one of them too.
  check:
    name: Check (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run_check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.check) }}
    defaults:
      run:
        # Same toolchain as local: every step runs inside the flake devshell.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Nx's local cache, per job: a task whose inputs are unchanged since the last run on this branch (or on
      # main, for a new branch) is restored instead of run. Pull requests read main's entries but write only their own.
      # The cache is only read through the task database in workspace-data, so both are kept.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db
          key: nx-${{ runner.os }}-${{ matrix.id }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ matrix.id }}-
      # nx affected measures against the plan's base commit; only its tree is needed, not its history.
      - name: Base commit
        if: needs.plan.outputs.fetch_base == 'true'
        run: git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$NX_BASE"
        env:
          NX_BASE: ${{ needs.plan.outputs.base }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: |
          # ARGS is unquoted so an empty one adds no argument.
          # shellcheck disable=SC2086
          bun run "$SCRIPT" $ARGS
        env:
          NX_BASE: ${{ needs.plan.outputs.base }}
          SCRIPT: ${{ matrix.script }}
          ARGS: ${{ matrix.args }}
          # The Angular compiler (ngc) runs out of its default heap typechecking the web projects.
          NODE_OPTIONS: --max-old-space-size=6144

  # `ci:test` split by project group so each job stays under 5 minutes: the character feature (its specs open pages
  # over Player Core's import), the other web projects (Angular unit tests), the api (its DB and compiled-binary
  # tests), and the other Bun projects, which also need Postgres. Together the groups cover every project with a test
  # target; a project not named below falls into a "rest" group.
  test:
    name: Check (test ${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run_test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test) }}
    services:
      postgres:
        # Same major/minor as the devshell's postgresql_18.
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin connection: DB tests create and drop their own databases on it.
      # Set here so the *.db.test.ts suites run instead of skipping.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pioneer
    defaults:
      run:
        # Same toolchain as local: every step runs inside the flake devshell.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Nx's local cache, per job: a task whose inputs are unchanged since the last run on this branch (or on
      # main, for a new branch) is restored instead of run. Pull requests read main's entries but write only their own.
      # The cache is only read through the task database in workspace-data, so both are kept.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db
          key: nx-${{ runner.os }}-test-${{ matrix.id }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-test-${{ matrix.id }}-
      # nx affected measures against the plan's base commit; only its tree is needed, not its history.
      - name: Base commit
        if: needs.plan.outputs.fetch_base == 'true'
        run: git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$NX_BASE"
        env:
          NX_BASE: ${{ needs.plan.outputs.base }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: |
          # ARGS holds several nx flags, so it is split on spaces.
          # shellcheck disable=SC2086
          bun run ci:test $ARGS
        env:
          NX_BASE: ${{ needs.plan.outputs.base }}
          ARGS: ${{ matrix.args }}
          # The Angular compiler worker ran out of its default heap compiling several projects at once.
          NODE_OPTIONS: --max-old-space-size=6144

  workflows:
    name: Workflow lint
    needs: plan
    if: needs.plan.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: actionlint
        run: actionlint
      - name: zizmor
        # Online audits (e.g. known-vulnerable action versions) need a token.
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  infra:
    name: OpenTofu
    needs: plan
    if: needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      # The Worker script is uploaded from the built bundle, and validate hashes it.
      - name: Build the Worker
        run: |
          bun install --frozen-lockfile
          bunx nx build edge
      # No backend and no credentials: providers come from the lock file, nothing is planned or applied.
      - name: Validate
        working-directory: infra
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
        env:
          # Only so the encryption block evaluates; nothing is encrypted without a backend.
          TF_VAR_state_passphrase: validate-only-passphrase

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      # Squash merges use the PR title as the commit, so it must be conventional too.
      - name: PR title
        run: printf '%s\n' "$TITLE" | committed --commit-file -
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - name: Commits
        run: committed --no-fixup --no-wip "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
