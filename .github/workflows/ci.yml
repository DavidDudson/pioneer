name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  # Bounds the .nx/cache directory each job saves; Nx evicts the least recently used entries past it.
  NX_MAX_CACHE_SIZE: 512MB

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `bun run check` split by runtime so each job stays near 4 minutes. The ci:* scripts together cover check;
  # a target added to check goes in one of them too. Storybook is the longest task, so it runs one Vitest project
  # (theme × colour mode) per job: each project runs every story, so the jobs take the same time, which
  # `--shard` (an even split by file count) does not.
  check:
    name: Check (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint, id: lint, script: ci:lint, args: '' }
          - { name: typecheck and build, id: build, script: ci:build, args: '' }
          - name: storybook frontier dark
            id: storybook-frontier-dark
            script: ci:storybook
            args: --args=--project=storybook:frontier-dark
          - name: storybook frontier light
            id: storybook-frontier-light
            script: ci:storybook
            args: --args=--project=storybook:frontier-light
          - name: storybook tavern dark
            id: storybook-tavern-dark
            script: ci:storybook
            args: --args=--project=storybook:tavern-dark
          - name: storybook tavern light
            id: storybook-tavern-light
            script: ci:storybook
            args: --args=--project=storybook:tavern-light
    defaults:
      run:
        # Same toolchain as local: every step runs inside the flake devshell.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Nx's local cache, per job: a task whose inputs are unchanged since the last run on this branch (or on
      # main, for a new branch) is restored instead of run. Pull requests read main's entries but write only their own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ matrix.id }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ matrix.id }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check
        run: |
          # ARGS is unquoted so an empty one adds no argument.
          # shellcheck disable=SC2086
          bun run "$SCRIPT" $ARGS
        env:
          SCRIPT: ${{ matrix.script }}
          ARGS: ${{ matrix.args }}

  test:
    name: Check (test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Same major/minor as the devshell's postgresql_18.
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin connection: DB tests create and drop their own databases on it.
      # Set here so the *.db.test.ts suites run instead of skipping.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pioneer
    defaults:
      run:
        # Same toolchain as local: every step runs inside the flake devshell.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Nx's local cache, per job: a task whose inputs are unchanged since the last run on this branch (or on
      # main, for a new branch) is restored instead of run. Pull requests read main's entries but write only their own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-test-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run ci:test

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: actionlint
        run: actionlint
      - name: zizmor
        # Online audits (e.g. known-vulnerable action versions) need a token.
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  infra:
    name: OpenTofu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      # The Worker script is uploaded from the built bundle, and validate hashes it.
      - name: Build the Worker
        run: |
          bun install --frozen-lockfile
          bunx nx build edge
      # No backend and no credentials: providers come from the lock file, nothing is planned or applied.
      - name: Validate
        working-directory: infra
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
        env:
          # Only so the encryption block evaluates; nothing is encrypted without a backend.
          TF_VAR_state_passphrase: validate-only-passphrase

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      # Squash merges use the PR title as the commit, so it must be conventional too.
      - name: PR title
        run: printf '%s\n' "$TITLE" | committed --commit-file -
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - name: Commits
        run: committed --no-fixup --no-wip "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
