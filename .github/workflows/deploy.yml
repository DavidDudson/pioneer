name: Deploy

# Deploys a published image to production with tools/deploy-production.ts. The Image workflow calls this after every
# publish from main; run it by hand to roll back or redeploy: `gh workflow run deploy.yml -f tag=sha-1a2b3c4`.
# See docs/production.md.

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to deploy (sha-<short commit>)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (sha-<short commit>); an earlier one rolls back
        type: string
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds AWS_DEPLOY_ROLE_ARN, and limits deploys to main.
    environment:
      name: production
    # One deploy at a time; a newer one waits rather than cancelling one half done. A deploy still waiting is
    # replaced by a newer one, which ships its commits too (migrations are cumulative).
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # assume the deploy role with OIDC
      packages: read # pull the image from ghcr.io
    defaults:
      run:
        # Same toolchain as local: aws and skopeo come from the flake devshell.
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      # Until production is stood up (docs/production.md), deploys are skipped instead of failing every merge.
      - id: ready
        shell: bash
        run: |
          if [ -z "$ROLE" ]; then
            echo "::warning::AWS_DEPLOY_ROLE_ARN is not set on the production environment; skipping the deploy."
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.ready.outputs.ready == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - if: steps.ready.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      # docker pulls the image to migrate with; skopeo reads the same credentials to copy it.
      - if: steps.ready.outputs.ready == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.ready.outputs.ready == 'true'
        name: Deploy
        run: bun tools/deploy-production.ts "$TAG"
        env:
          TAG: ${{ inputs.tag }}
