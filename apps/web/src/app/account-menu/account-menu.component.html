@if (session.user(); as user) {
  <fr-stack direction="horizontal" gap="xs" align="center">
    <fr-link variant="caption" [to]="accountPath">{{ user.displayName }}</fr-link>
    <fr-async-button variant="ghost" size="sm" [action]="signOut">{{
      'shell.account.signOut' | transloco
    }}</fr-async-button>
  </fr-stack>
} @else if (session.known()) {
  <fr-button variant="ghost" size="sm" (pressed)="session.showSignIn()">{{
    'shell.account.signIn' | transloco
  }}</fr-button>
}
