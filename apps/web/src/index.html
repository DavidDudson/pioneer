<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pioneer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Apply the stored theme and mode before first paint; ThemeStore (frontier) owns them after boot.
      try {
        const root = document.documentElement;
        root.dataset.theme = localStorage.getItem('fr-theme') ?? 'frontier';
        root.dataset.mode = localStorage.getItem('fr-mode') ?? 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <pio-root></pio-root>
  </body>
</html>
