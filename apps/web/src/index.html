<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pioneer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- FontStylesheets adds the face stylesheets after boot; connecting now saves the TLS handshakes then. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply the stored theme and mode before first paint; ThemeStore (frontier) owns them after boot.
      try {
        const root = document.documentElement;
        const theme = localStorage.getItem('fr-theme');
        // A stored "dynamic" follows the open page's theme, which only the app knows: start on the default.
        root.dataset.theme = theme === 'dynamic' ? 'frontier' : (theme ?? 'frontier');
        const mode = localStorage.getItem('fr-mode');
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.mode = mode === 'system' ? (systemDark ? 'dark' : 'light') : (mode ?? 'dark');
      } catch {}
    </script>
  </head>
  <body>
    <pio-root></pio-root>
  </body>
</html>
