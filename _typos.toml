[files]
# orc-attribution.ts: author names copied verbatim from licensors' credits.
extend-exclude = [
  "bun.lock",
  "apps/api/migrations/meta/**",
  "libs/frontier/src/styles/primitives.color.css",
  "libs/legal/feature/src/lib/legal-page/orc-attribution.ts",
  # The import backlog: Foundry's raw JSON, kept as Foundry wrote it (ADR-0031).
  "content/import/*.json",
]

[default]
# Foundry document ids are random 16-character strings inside compendium UUIDs.
extend-ignore-re = [
  "Compendium\\.pf2e\\.[a-z0-9-]+\\.Item\\.[A-Za-z0-9]{16}",
  "JournalEntryPage\\.[A-Za-z0-9]{16}",
  # Foundry actor ids in a creature's `foundry` external id (Monster Core).
  "Compendium\\.pf2e\\.[a-z0-9-]+\\.Actor\\.[A-Za-z0-9]{16}",
  # Foundry's 16-character embedded item ids in the backlog.
  "\"_id\": \"[A-Za-z0-9]{16}\"",
  # Foundry's 16-character rule and note keys.
  "\"key\": \"[a-z0-9]{16}\"",
  # ICU ordinal suffixes in messages: `{rank, selectordinal, one {#st} two {#nd} ...}`.
  "\\{#(st|nd|rd|th)\\}",
  # Pronunciation guides in deity descriptions: Tolte Coatl (TOLL-teh coh-AHtl).
  "TOLL-teh",
  # A typo in Foundry's Rage of Elements text, kept as imported.
  "difficult terrain fo your enemies",
  # Foundry journal page ids inside compendium UUIDs.
  "JournalEntryPage\\.[A-Za-z0-9]{16}",
  # Names and terms: Ded Moroz-style fey patrons (Dark Archive), a ba-sadhak (Impossible Lands).
  "Ded (Bolota|Bereza)",
  "ba-sadhak",
  # A French term in a creature name (NPC Core): Idée Fixe.
  "Idée Fixe",
  # The ordinal suffixes in the staff matcher's rank label pattern.
  "\\(\\?:st\\|nd\\|rd\\|th\\)",
]

[default.extend-words]
# Pathfinder terms and deliberate spellings.
leshy = "leshy"
# Deity names (Divine Mysteries).
brigh = "brigh"
nin = "nin"
sherif = "sherif"
# Slugs drop apostrophes: `feat:youre-next` is You're Next.
youre = "youre"
# Slug: `feat:complete-the-heros-journey` is Complete the Hero's Journey.
heros = "heros"
# Verex's Ruin, a cursed weapon (War of Immortals).
verex = "verex"
# Slug: `option:against-poison-disease-onself` is Foundry's own spelling of a rule option (Rage of Elements).
onself = "onself"
# Feat name Hobbling Criticals, and Foundry's spelling in an item description (Impossible Magic).
criticals = "criticals"
overlayed = "overlayed"

# Paizo's own misspellings, kept as imported (ADR-0031); scoped to JSON so code still gets checked.
