[files]
# orc-attribution.ts: author names copied verbatim from licensors' credits.
extend-exclude = [
  "bun.lock",
  "apps/api/migrations/meta/**",
  "libs/frontier/src/styles/primitives.color.css",
  "libs/legal/feature/src/lib/legal-page/orc-attribution.ts",
  # The import backlog: Foundry's raw JSON, kept as Foundry wrote it (ADR-0031).
  "content/import/*.json",
]

[default]
# Foundry document ids are random 16-character strings inside compendium UUIDs.
extend-ignore-re = [
  "Compendium\\.pf2e\\.[a-z0-9-]+\\.Item\\.[A-Za-z0-9]{16}",
  # ICU ordinal suffixes in messages: `{rank, selectordinal, one {#st} two {#nd} ...}`.
  "\\{#(st|nd|rd|th)\\}",
  # Pronunciation guides in deity descriptions: Tolte Coatl (TOLL-teh coh-AHtl).
  "TOLL-teh",
]

[default.extend-words]
# Pathfinder terms and deliberate spellings.
leshy = "leshy"
# Deity names (Divine Mysteries).
brigh = "brigh"
nin = "nin"
sherif = "sherif"
# Slugs drop apostrophes: `feat:youre-next` is You're Next.
youre = "youre"
